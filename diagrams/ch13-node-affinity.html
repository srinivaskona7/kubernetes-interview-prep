<!DOCTYPE html>
<html lang="en">
<head>

  <title>Required versus preferred node affinity</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }

  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow</p>
    <h1>Required versus preferred node affinity</h1>
    <svg viewBox="0 0 960 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch13-node-affinity-title ch13-node-affinity-desc">
      <title id="ch13-node-affinity-title">Required versus preferred node affinity</title>
      <desc id="ch13-node-affinity-desc">A Pod with node affinity has a required rule and a preferred rule. If a node matches, the Pod runs there. With no match, a required rule leaves the Pod Pending, while a preferred rule lets it be placed on another node.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="48" y="96" width="184" height="96" rx="6" fill="#f5f5f5"/><rect x="48" y="96" width="184" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="140.0" y="130.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod with node affinity</text><text x="140.0" y="146.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">rules match node labels</text><text x="140.0" y="158.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">checked only at scheduling</text><rect x="320" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="64" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400.0" y="88.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Required rule</text><text x="400.0" y="104.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hard rule</text><rect x="320" y="208" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="208" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400.0" y="232.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Preferred rule</text><text x="400.0" y="248.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">weighted hint</text><rect x="648" y="32" width="264" height="56" rx="6" fill="#f5f5f5"/><rect x="648" y="32" width="264" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="780.0" y="52.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Runs on a matching node</text><text x="780.0" y="68.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">label matched</text><rect x="648" y="104" width="264" height="56" rx="6" fill="#f5f5f5"/><rect x="648" y="104" width="264" height="56" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="780.0" y="124.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod stays Pending</text><text x="780.0" y="140.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no node matches</text><rect x="648" y="176" width="264" height="56" rx="6" fill="#f5f5f5"/><rect x="648" y="176" width="264" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="780.0" y="196.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Runs on a matching node</text><text x="780.0" y="212.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">scheduler favours it by weight</text><rect x="648" y="248" width="264" height="56" rx="6" fill="#f5f5f5"/><rect x="648" y="248" width="264" height="56" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="780.0" y="268.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Placed on another node</text><text x="780.0" y="284.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">scheduler ignores the hint</text><path d="M232,144 H276 V96 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M232,144 H276 V240 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M480,96 H520 V60 H648" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="564.0" y="54" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="584" y="63" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MATCH</text><path d="M480,96 H520 V132 H648" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="556.0" y="126" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="584" y="135" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO MATCH</text><path d="M480,240 H520 V204 H648" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="564.0" y="198" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="584" y="207" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MATCH</text><path d="M480,240 H520 V276 H648" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="556.0" y="270" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="584" y="279" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO MATCH</text><text x="48" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">Once placed, a Pod stays put even if the node labels change later: no eviction.</text>
<line x1="32" y1="352" x2="928" y2="352" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="364" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="136" y="373" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">RULE OR OUTCOME</text><rect x="277" y="364" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="301" y="373" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">OUTCOME WITH NO MATCH</text>
    </svg>
  </div>
