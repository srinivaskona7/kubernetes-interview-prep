      <desc id="ch7-externalname-cname-desc">A pod looks up the Service name, cluster DNS answers with a CNAME to an external host, and the pod connects to that host directly with no proxying.</desc>

      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

roke-width="1"/><text x="800" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CNAME answer</text><text x="800" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">db.example.com</text><rect x="680" y="204" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="680" y="204" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="800" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">External host</text><text x="800" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">outside the cluster</text><rect x="40" y="196" width="480" height="72" rx="6" fill="#f5f5f5"/><rect x="40" y="196" width="480" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="280" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Host header and TLS name</text><text x="280" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">still say billing: set Host or use the real name</text><line x1="32" y1="304" x2="928" y2="304" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="316" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">FOCAL</text><rect x="224" y="316" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="248" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">STEP</text>
    </svg>
