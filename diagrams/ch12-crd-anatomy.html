<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomy of a CRD manifest</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Structure</p>
    <h1>Anatomy of a CRD manifest</h1>
    <svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch12-crd-anatomy-title ch12-crd-anatomy-desc">
      <title id="ch12-crd-anatomy-title">Anatomy of a CRD manifest</title>
      <desc id="ch12-crd-anatomy-desc">The important fields of a CRD: metadata name, group, names, scope, and a versions list with schema, served and storage flags, and subresources.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="40" y="32" width="880" height="328" rx="8" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4 4"/><text x="52" y="50" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CUSTOMRESOURCEDEFINITION</text><rect x="360" y="56" width="536" height="288" rx="8" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4 4"/><text x="372" y="74" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SPEC.VERSIONS[] ENTRY</text><rect x="64" y="64" width="232" height="56" rx="6" fill="#f5f5f5"/><rect x="64" y="64" width="232" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="180" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">metadata.name</text><text x="180" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">plural.group, books.example.com</text><rect x="64" y="136" width="232" height="56" rx="6" fill="#f5f5f5"/><rect x="64" y="136" width="232" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="180" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">spec.group</text><text x="180" y="176" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">the API group</text><rect x="64" y="208" width="232" height="56" rx="6" fill="#f5f5f5"/><rect x="64" y="208" width="232" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="180" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">spec.names</text><text x="180" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">kind, listKind, plural, singular</text><rect x="64" y="280" width="232" height="56" rx="6" fill="#f5f5f5"/><rect x="64" y="280" width="232" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="180" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">spec.scope</text><text x="180" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">Namespaced or Cluster</text><rect x="392" y="96" width="232" height="56" rx="6" fill="#f5f5f5"/><rect x="392" y="96" width="232" height="56" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="508" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">openAPIV3Schema</text><text x="508" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">describes spec and status</text><rect x="392" y="176" width="232" height="56" rx="6" fill="#f5f5f5"/><rect x="392" y="176" width="232" height="56" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="508" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">served and storage</text><text x="508" y="216" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">exactly one storage: true</text><rect x="392" y="256" width="232" height="56" rx="6" fill="#f5f5f5"/><rect x="392" y="256" width="232" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="508" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">subresources</text><text x="508" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">status written by controller</text><rect x="648" y="96" width="224" height="56" rx="6" fill="#f5f5f5"/><rect x="648" y="96" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="760" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">name</text><text x="760" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">the version, such as v1</text><line x1="32" y1="408" x2="928" y2="408" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="420" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">FOCAL</text><rect x="288" y="420" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="312" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">STEP</text>
    </svg>
  </div>
</body>
</html>
