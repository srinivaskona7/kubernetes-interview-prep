<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>What a CNI plugin sets up for a Pod</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Networking · CNI</p>
    <h1>What a CNI plugin sets up for a Pod</h1>
    <svg viewBox="0 0 960 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch6-cni-functions-title ch6-cni-functions-desc">
      <title id="ch6-cni-functions-title">What a CNI plugin sets up for a Pod</title>
      <desc id="ch6-cni-functions-desc">The container runtime calls the CNI plugin when a Pod starts. The plugin creates the network namespace and veth, allocates an IP through IPAM and sets routes and DNS, with optional bridge or overlay, host networking and policy hooks.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="32" y="48" width="160" height="72" rx="6" fill="#f5f5f5"/><rect x="32" y="48" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="112" y="81" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container runtime</text><text x="112" y="97" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">creates the Pod sandbox</text><rect x="288" y="48" width="176" height="72" rx="6" fill="#f5f5f5"/><rect x="288" y="48" width="176" height="72" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="376" y="81" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CNI plugin</text><text x="376" y="97" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">called when the Pod starts</text><rect x="32" y="176" width="896" height="232" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><rect x="44" y="180" width="200" height="12" rx="2" fill="#f5f5f5"/><text x="52" y="189" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHAT THE PLUGIN SETS UP</text><rect x="64" y="216" width="256" height="72" rx="6" fill="#f5f5f5"/><rect x="64" y="216" width="256" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="192" y="249" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Namespace setup</text><text x="192" y="265" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">isolated network stack, veth to node</text><rect x="352" y="216" width="256" height="72" rx="6" fill="#f5f5f5"/><rect x="352" y="216" width="256" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="249" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IP management</text><text x="480" y="265" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">IPAM: allocate on start, free on delete</text><rect x="640" y="216" width="256" height="72" rx="6" fill="#f5f5f5"/><rect x="640" y="216" width="256" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="768" y="249" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Routes and DNS</text><text x="768" y="265" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reach Pods, nodes and the outside</text><rect x="64" y="312" width="256" height="72" rx="6" fill="#f5f5f5"/><rect x="64" y="312" width="256" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="192" y="345" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bridge or overlay</text><text x="192" y="361" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same-node and cross-node links</text><rect x="352" y="312" width="256" height="72" rx="6" fill="#f5f5f5"/><rect x="352" y="312" width="256" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="480" y="345" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Host networking</text><text x="480" y="361" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">optionally share the node network</text><rect x="640" y="312" width="256" height="72" rx="6" fill="#f5f5f5"/><rect x="640" y="312" width="256" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="768" y="345" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Policy hooks</text><text x="768" y="361" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NetworkPolicy where supported</text><path d="M192,84 L288,84" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="223" y="64" width="34" height="12" rx="2" fill="#f5f5f5"/><text x="240" y="73" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 ADD</text><path d="M376,120 L376,176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="388" y="152" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">2 SETS UP</text><text x="32" y="448" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Core job (solid): every Pod gets a namespace, an IP and routes. Optional (dashed): depends on the plugin you choose.</text><text x="32" y="464" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">On Pod delete the plugin is called again so the IP is released and reused safely.</text><line x1="32" y1="488" x2="928" y2="488" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="500" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="509" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CNI PLUGIN</text><rect x="224" y="500" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="248" y="509" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CORE FUNCTION</text><rect x="352" y="500" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="376" y="509" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">OPTIONAL, PLUGIN DEPENDENT</text>
    </svg>
  </div>
</body>
</html>
