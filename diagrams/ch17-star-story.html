<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A STAR story in four beats</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Interview · Behavioural</p>
    <h1>A STAR story in four beats</h1>

    <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch17-star-story-title ch17-star-story-desc">
      <title id="ch17-star-story-title">A STAR story in four beats</title>
      <desc id="ch17-star-story-desc">Four beats of a STAR answer drawn with widths matching time share: situation, task, action as the focal beat, result, then the lasting fix that follows.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      
      <rect x="40" y="64" width="112" height="96" rx="6" fill="#f5f5f5"/><rect x="40" y="64" width="112" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="52" y="74" width="72" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="88" y="83" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BEAT 1 · 10%</text><text x="52" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Situation</text><text x="52" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">one breath,</text><text x="52" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">name the stakes</text>
<rect x="208" y="64" width="128" height="96" rx="6" fill="#f5f5f5"/><rect x="208" y="64" width="128" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="220" y="74" width="72" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="256" y="83" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BEAT 2 · 15%</text><text x="220" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Task</text><text x="220" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">what you owned,</text><text x="220" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">not the team&#x27;s</text>
<rect x="392" y="64" width="360" height="96" rx="6" fill="#f5f5f5"/><rect x="392" y="64" width="360" height="96" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><rect x="404" y="74" width="72" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/><text x="440" y="83" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BEAT 3 · 50%</text><text x="404" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Action</text><text x="404" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">say &#x27;I&#x27;, not &#x27;we&#x27;</text><text x="404" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">your decisions, plus the commands</text><text x="404" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">and signals behind them</text>
<rect x="808" y="64" width="152" height="96" rx="6" fill="#f5f5f5"/><rect x="808" y="64" width="152" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="820" y="74" width="72" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="856" y="83" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BEAT 4 · 25%</text><text x="820" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Result</text><text x="820" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">a number: recovery</text><text x="820" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">time, error rate, cost</text>
<rect x="808" y="208" width="152" height="72" rx="6" fill="#f5f5f5"/><rect x="808" y="208" width="152" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="820" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Follow-up fix</text><text x="820" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">alert, runbook or</text><text x="820" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">admission policy</text>
      <path d="M152,112 L208,112" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="180" y="104" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROLE</text>
<path d="M336,112 L392,112" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="364" y="104" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STEPS</text>
<path d="M752,112 L808,112" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="780" y="104" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROOF</text>
<path d="M884,160 L884,208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="892" y="190" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">AFTERWARDS</text>
<text x="40" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Box width = share of a two-minute answer.</text>
<text x="40" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Situation and task together stay near a quarter.</text>
<text x="40" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Say what you learned: it signals growth.</text>
      <line x1="32" y1="312" x2="968" y2="312" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="120" y1="324" x2="148" y2="324" stroke="#4f5d75" stroke-width="1.2"/><text x="156" y="327" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flow</text><rect x="212" y="320" width="12" height="8" rx="2" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><text x="232" y="327" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">where most of the time goes</text>
    </svg>
  </div>
</body>
</html>
