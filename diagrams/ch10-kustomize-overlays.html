<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kustomize: one base, many overlays</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Configuration</p>

/text><text x="460" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2 replicas</text><rect x="360" y="292" width="200" height="80" rx="6" fill="#f5f5f5"/><rect x="360" y="292" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="368" y="300" width="48" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.8" stroke-width="0.8"/><text x="392" y="309" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OVERLAY</text><text x="460" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">overlays/prod</text><text x="460" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">6 replicas, limits</text><rect x="720" y="60" width="200" height="64" rx="6" fill="#f5f5f5"/><rect x="720" y="60" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/><rect x="728" y="68" width="48" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.8" stroke-width="0.8"/><text x="752" y="77" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLUSTER</text><text x="820" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dev</text><rect x="720" y="180" width="200" height="64" rx="6" fill="#f5f5f5"/><rect x="720" y="180" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/><rect x="728" y="188" width="48" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.8" stroke-width="0.8"/><text x="752" y="197" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLUSTER</text><text x="820" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Ge
