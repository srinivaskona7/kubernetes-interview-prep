<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which Service type do I need</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Services</p>
    <h1>Which Service type do I need</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch7-service-decision-title ch7-service-decision-desc">
      <title id="ch7-service-decision-title">Which Service type do I need</title>
      <desc id="ch7-service-decision-desc">Decision flowchart choosing between ExternalName, ClusterIP, LoadBalancer and NodePort services.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <line x1="300" y1="60" x2="300" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="180" x2="300" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="308" y="204" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="322" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <line x1="300" y1="320" x2="300" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="308" y="344" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="322" y="353" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <line x1="300" y1="460" x2="300" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="308" y="474" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="322" y="483" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <line x1="410" y1="140" x2="620" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="497" y="120" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="515" y="129" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <line x1="410" y1="280" x2="620" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="497" y="260" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="515" y="269" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <line x1="410" y1="420" x2="620" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="497" y="400" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="515" y="409" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="220" y="20" width="160" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Expose a workload</text>
      <polygon points="300,100 410,140 300,180 190,140" fill="#f5f5f5"/>
      <polygon points="300,100 410,140 300,180 190,140" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="138" fill="#2d3142" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">Reaching an external</text>
      <text x="300" y="150" fill="#2d3142" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">DNS name?</text>
      <polygon points="300,240 410,280 300,320 190,280" fill="#f5f5f5"/>
      <polygon points="300,240 410,280 300,320 190,280" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="278" fill="#2d3142" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">Callers outside</text>
      <text x="300" y="290" fill="#2d3142" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">the cluster?</text>
      <polygon points="300,380 410,420 300,460 190,420" fill="#f5f5f5"/>
      <polygon points="300,380 410,420 300,460 190,420" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="418" fill="#2d3142" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">Cloud load balancer</text>
      <text x="300" y="430" fill="#2d3142" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">available?</text>
      <rect x="620" y="116" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="116" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="700" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ExternalName</text>
      <text x="700" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CNAME alias</text>
      <rect x="620" y="256" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="256" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="700" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ClusterIP</text>
      <text x="700" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">internal virtual IP</text>
      <rect x="620" y="396" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="396" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="700" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LoadBalancer</text>
      <text x="700" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cloud LB + external IP</text>
      <rect x="220" y="500" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="500" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NodePort</text>
      <text x="300" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">port on every node</text>
      <line x1="30" y1="604" x2="970" y2="604" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <text x="120" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DIAMOND = DECISION   RECTANGLE = RESULT</text>
    </svg>
  </div>
</body>
</html>
