<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pod creation sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence</p>
    <h1>Creating a Pod, step by step</h1>
    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-pod-title ch2-pod-desc">
      <title id="ch2-pod-title">Pod creation sequence</title>
      <desc id="ch2-pod-desc">Six numbered steps: kubectl posts the Pod to the API server, which stores it in etcd; the scheduler binds it to a node; the kubelet sees the assignment and reports Running.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="40" y="56" width="120" height="56" rx="6" fill="#f5f5f5"/><rect x="40" y="56" width="120" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="100" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kubectl</text>
<text x="100" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">client</text>
<line x1="100" y1="112" x2="100" y2="408" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="260" y="56" width="120" height="56" rx="6" fill="#f5f5f5"/><rect x="260" y="56" width="120" height="56" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="320" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Server</text>
<text x="320" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">kube-apiserver</text>
<line x1="320" y1="112" x2="320" y2="408" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="480" y="56" width="120" height="56" rx="6" fill="#f5f5f5"/><rect x="480" y="56" width="120" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="540" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">etcd</text>
<text x="540" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">state store</text>
<line x1="540" y1="112" x2="540" y2="408" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="700" y="56" width="120" height="56" rx="6" fill="#f5f5f5"/><rect x="700" y="56" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="760" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scheduler</text>
<text x="760" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">kube-scheduler</text>
<line x1="760" y1="112" x2="760" y2="408" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="860" y="56" width="120" height="56" rx="6" fill="#f5f5f5"/><rect x="860" y="56" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="920" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kubelet</text>
<text x="920" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">on the node</text>
<line x1="920" y1="112" x2="920" y2="408" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/>
<path d="M100,152 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="210" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 CREATE POD (REST)</text>
<path d="M320,196 H540" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="430" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 STORE POD, NO NODE YET</text>
<path d="M760,240 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="540" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 WATCH UNBOUND POD, THEN BIND TO NODE</text>
<path d="M320,284 H540" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="430" y="276" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">4 SAVE NODE NAME</text>
<path d="M920,328 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="620" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">5 WATCH: POD ASSIGNED TO ME</text>
<path d="M920,372 H320" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="620" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">6 START CONTAINERS, REPORT RUNNING</text>
<line x1="30" y1="424" x2="930" y2="424" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="30" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="120" y="432" width="12" height="12" rx="2" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="140" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL COMPONENT</text>
<rect x="310" y="432" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="330" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">COMPONENT</text>
<rect x="500" y="432" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="520" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CLIENT OR STATE STORE</text>

    </svg>
  </div>
</body>
</html>
