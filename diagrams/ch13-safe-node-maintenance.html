<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taking a node out without downtime</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence</p>
    <h1>Taking a node out without downtime</h1>
    <svg viewBox="0 0 960 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch13-safe-node-maintenance-title ch13-safe-node-maintenance-desc">
      <title id="ch13-safe-node-maintenance-title">Taking a node out without downtime</title>
      <desc id="ch13-safe-node-maintenance-desc">Check capacity and the PDB, cordon the node, drain it through the eviction API, do the maintenance, then uncordon it.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M168,100 H216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M360,100 H408" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M552,100 H600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M744,100 H792" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M480,208 V136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="460" y="166" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="175" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEEDS</text><rect x="24" y="64" width="144" height="72" rx="6" fill="#f5f5f5"/><rect x="24" y="64" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="96" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1. Check first</text><text x="96" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">spare capacity, spread,</text><text x="96" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PDB allows a disruption</text><rect x="216" y="64" width="144" height="72" rx="6" fill="#f5f5f5"/><rect x="216" y="64" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="288" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2. Cordon</text><text x="288" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no new Pods land</text><rect x="408" y="64" width="144" height="72" rx="6" fill="#f5f5f5"/><rect x="408" y="64" width="144" height="72" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="480" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3. Drain</text><text x="480" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">evicts via eviction API,</text><text x="480" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PDBs and grace honoured</text><rect x="600" y="64" width="144" height="72" rx="6" fill="#f5f5f5"/><rect x="600" y="64" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="672" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4. Maintain</text><text x="672" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">do the node work</text><rect x="792" y="64" width="144" height="72" rx="6" fill="#f5f5f5"/><rect x="792" y="64" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="864" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5. Uncordon</text><text x="864" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Pods do not move back</text><rect x="408" y="208" width="144" height="72" rx="6" fill="#f5f5f5"/><rect x="408" y="208" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Drain flags</text><text x="480" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">--ignore-daemonsets</text><text x="480" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">--delete-emptydir-data</text><line x1="32" y1="316" x2="928" y2="316" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="328" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="136" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">STEP</text><rect x="192" y="328" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="216" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">PDB-AWARE EVICTION</text>
    </svg>
  </div>
</body>
</html>
