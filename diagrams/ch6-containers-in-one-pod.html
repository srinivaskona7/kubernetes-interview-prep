<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Containers in one Pod talk over localhost</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Networking · Inside a Pod</p>
    <h1>Containers in one Pod talk over localhost</h1>
    <svg viewBox="0 0 960 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch6-containers-in-one-pod-title ch6-containers-in-one-pod-desc">
      <title id="ch6-containers-in-one-pod-title">Containers in one Pod talk over localhost</title>
      <desc id="ch6-containers-in-one-pod-desc">Three containers share one network namespace and one Pod IP. A web server reaches the app on localhost, a sidecar does the same, and an outside Pod addresses the Pod IP.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="256" y="40" width="672" height="256" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><rect x="268" y="44" width="336" height="12" rx="2" fill="#f5f5f5"/><text x="276" y="53" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ONE POD = ONE NETWORK NAMESPACE = ONE IP</text><rect x="32" y="112" width="128" height="80" rx="6" fill="#f5f5f5"/><rect x="32" y="112" width="128" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="96" y="149" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Other Pod</text><text x="96" y="165" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">outside caller</text><rect x="288" y="112" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="288" y="112" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="368" y="149" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web server</text><text x="368" y="165" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">listens on :8080</text><rect x="592" y="112" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="592" y="112" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="672" y="149" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App</text><text x="672" y="165" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">listens on :5000</text><rect x="592" y="216" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="592" y="216" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="672" y="245" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sidecar</text><text x="672" y="261" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">logging helper</text><rect x="288" y="216" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="288" y="216" width="160" height="64" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="368" y="245" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shared netns</text><text x="368" y="261" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one IP, one port space</text><rect x="784" y="112" width="128" height="80" rx="6" fill="#f5f5f5"/><rect x="784" y="112" width="128" height="80" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="848" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Port clash</text><text x="848" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same port twice</text><text x="848" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">second bind fails</text><path d="M160,152 L288,152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="170" y="132" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="208" y="141" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 POD IP:8080</text><path d="M448,152 L592,152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="474" y="132" width="92" height="12" rx="2" fill="#f5f5f5"/><text x="520" y="141" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 LOCALHOST:5000</text><path d="M672,216 L672,192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="684" y="209" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">3 LOCALHOST:5000</text><text x="32" y="336" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Containers in a Pod share the IP, loopback and ports, so they reach each other on localhost.</text><text x="32" y="352" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Traffic on localhost never leaves the Pod. Keep only tightly coupled processes together.</text><line x1="32" y1="376" x2="928" y2="376" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="388" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="136" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CONTAINER OR CALLER</text><rect x="274" y="388" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="298" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">SHARED NAMESPACE</text><rect x="419" y="388" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="443" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">FAILURE MODE</text><line x1="542" y1="394" x2="570" y2="394" stroke="#4f5d75" stroke-width="1.2"/><text x="578" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">REQUEST</text>
    </svg>
  </div>

</html>
