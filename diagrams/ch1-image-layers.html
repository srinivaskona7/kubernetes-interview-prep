<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image layers and cache</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layers · Image build</p>
    <h1>Image layers and cache</h1>

    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch1-image-layers-title ch1-image-layers-desc">
<title id="ch1-image-layers-title">Image layers and cache</title>
<desc id="ch1-image-layers-desc">Stack of read-only layers from base image to source, with a temporary writable layer on top, and notes on cache order and sharing.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="40" y="84" width="400" height="312" rx="8" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3"/>
<text x="56" y="102" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">IMAGE: READ-ONLY LAYERS, BUILT 1 TO 4</text>
<rect x="60" y="120" width="360" height="56" rx="6" fill="#f5f5f5"/>
<rect x="60" y="120" width="360" height="56" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="240.0" y="146.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4  COPY source</text>
<text x="240.0" y="162.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">changes most often, rebuilt on every code change</text>
<rect x="60" y="188" width="360" height="56" rx="6" fill="#f5f5f5"/>
<rect x="60" y="188" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="240.0" y="214.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3  RUN install dependencies</text>
<text x="240.0" y="230.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">reused from cache while the manifests are unchanged</text>
<rect x="60" y="256" width="360" height="56" rx="6" fill="#f5f5f5"/>
<rect x="60" y="256" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="240.0" y="282.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2  COPY package files</text>
<text x="240.0" y="298.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">reused from cache</text>
<rect x="60" y="324" width="360" height="56" rx="6" fill="#f5f5f5"/>
<rect x="60" y="324" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="240.0" y="350.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1  FROM base image</text>
<text x="240.0" y="366.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">shared with every image using this base</text>
<rect x="620" y="110" width="320" height="56" rx="6" fill="#f5f5f5"/>
<rect x="620" y="110" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="780.0" y="136.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container A: writable layer</text>
<text x="780.0" y="152.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">copy-on-write, lost when removed</text>
<rect x="620" y="210" width="320" height="56" rx="6" fill="#f5f5f5"/>
<rect x="620" y="210" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="780.0" y="236.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container B: writable layer</text>
<text x="780.0" y="252.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">copy-on-write, lost when removed</text>
<path d="M620 138 H440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="505.8" y="132" width="48.4" height="12" rx="2" fill="#f5f5f5"/>
<text x="530" y="141" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUNS ON</text>
<path d="M620 238 H440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="505.8" y="232" width="48.4" height="12" rx="2" fill="#f5f5f5"/>
<text x="530" y="241" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUNS ON</text>
<text x="620" y="310" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">CHANGE ONLY COPY SOURCE:</text>
<text x="620" y="326" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">layers 1 to 3 come from cache,</text>
<text x="620" y="342" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">only layer 4 is rebuilt and pushed.</text>

    </svg>
  </div>
</body>
</html>
