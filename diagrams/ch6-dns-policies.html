<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choosing a Pod dnsPolicy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Networking · DNS</p>
    <h1>Choosing a Pod dnsPolicy</h1>
    <svg viewBox="0 0 960 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch6-dns-policies-title ch6-dns-policies-desc">
      <title id="ch6-dns-policies-title">Choosing a Pod dnsPolicy</title>
      <desc id="ch6-dns-policies-desc">A Pod chooses one of four dnsPolicy values: ClusterFirst asks cluster DNS first, Default inherits the node resolver, ClusterFirstWithHostNet keeps cluster DNS for hostNetwork Pods, and None leaves everything to dnsConfig.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="400" y="48" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="400" y="48" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod</text><text x="480" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">spec.dnsPolicy</text><path d="M412,112 L412,144 Q412,152 404,152 L136,152 Q128,152 128,160 L128,200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="24" y="200" width="208" height="64" rx="6" fill="#f5f5f5"/><rect x="24" y="200" width="208" height="64" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="128" y="229" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ClusterFirst</text><text x="128" y="245" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the default policy</text><path d="M128,264 L128,320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="24" y="320" width="208" height="64" rx="6" fill="#f5f5f5"/><rect x="24" y="320" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="128" y="349" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cluster DNS first</text><text x="128" y="365" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">then upstream fallback</text><path d="M452,112 L452,160 Q452,168 444,168 L372,168 Q364,168 364,176 L364,200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="260" y="200" width="208" height="64" rx="6" fill="#f5f5f5"/><rect x="260" y="200" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="364" y="229" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Default</text><text x="364" y="245" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">inherit node settings</text><path d="M364,264 L364,320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="260" y="320" width="208" height="64" rx="6" fill="#f5f5f5"/><rect x="260" y="320" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="364" y="349" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node resolv.conf</text><text x="364" y="365" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no cluster names</text><path d="M508,112 L508,160 Q508,168 516,168 L592,168 Q600,168 600,176 L600,200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="496" y="200" width="208" height="64" rx="6" fill="#f5f5f5"/><rect x="496" y="200" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="600" y="229" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ClusterFirstWithHostNet</text><text x="600" y="245" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">for hostNetwork Pods</text><path d="M600,264 L600,320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="496" y="320" width="208" height="64" rx="6" fill="#f5f5f5"/><rect x="496" y="320" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="600" y="349" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cluster DNS first</text><text x="600" y="365" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keeps Service lookup</text><path d="M548,112 L548,144 Q548,152 556,152 L828,152 Q836,152 836,160 L836,200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="732" y="200" width="208" height="64" rx="6" fill="#f5f5f5"/><rect x="732" y="200" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="836" y="229" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">None</text><text x="836" y="245" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">you define everything</text><path d="M836,264 L836,320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="732" y="320" width="208" height="64" rx="6" fill="#f5f5f5"/><rect x="732" y="320" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="836" y="349" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dnsConfig</text><text x="836" y="365" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nameservers, search, options</text><text x="32" y="424" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Keep ClusterFirst for almost every workload. A hostNetwork Pod under ClusterFirst silently falls back to node DNS.</text><text x="32" y="440" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Despite its name, Default is not the default. None needs dnsConfig, otherwise the Pod has no resolver.</text><line x1="32" y1="456" x2="928" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="468" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="477" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">DEFAULT POLICY</text><rect x="246" y="468" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="270" y="477" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">OPTION OR RESULT</text>
    </svg>
  </div>
</body>
</html>
