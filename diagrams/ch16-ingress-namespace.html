"201" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FIX</text><text x="704.0" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Co-locate or alias</text><text x="704.0" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Ingress in the api namespace</text><text x="704.0" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">or ExternalName / ReferenceGrant</text><path d="M192 108 L264 108" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="228" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">resolves</text><path d="M352 152 L352 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="360" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">miss</text><path d="M704 184 L704 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="712" y="172" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">then it resolves</text><text x="516" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">namespace</text><text x="516" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">boundary</text><line x1="32" y1="312" x2="840" y2="312" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="120" y1="324" x2="148" y2="324" stroke="#4f5d75" stroke-width="1.2"/><text x="156" y="327" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flow</text><rect x="199" y="320"
