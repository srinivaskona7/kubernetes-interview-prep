<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>When the cluster has no room</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Autoscaling · Capacity</p>
    <h1>When the cluster has no room</h1>

    <svg viewBox="0 0 960 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch4-pitfalls-capacity-title ch4-pitfalls-capacity-desc">
<title id="ch4-pitfalls-capacity-title">When the cluster has no room</title>
<desc id="ch4-pitfalls-capacity-desc">Pod autoscalers decide from metrics only, so Pods go Pending when nodes are full.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M260 76 H380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="290" y="56" width="60" height="12" rx="2" fill="#f5f5f5"/>
<text x="320" y="65" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATES</text>
<path d="M580 76 H700" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="616" y="56" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="640" y="65" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FINDS</text>
<path d="M800 112 V180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="808" y="140" width="52" height="12" rx="2" fill="#f5f5f5"/>
<text x="834" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>
<path d="M700 216 H580" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="624" y="196" width="32" height="12" rx="2" fill="#f5f5f5"/>
<text x="640" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIX</text>
<rect x="60" y="40" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect x="60" y="40" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="160" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HPA or VPA</text>
<text x="160" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">decides from metrics only</text>
<rect x="380" y="40" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect x="380" y="40" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">New Pod</text>
<text x="480" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">needs a node</text>
<rect x="700" y="40" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect x="700" y="40" width="200" height="72" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="800" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nodes full</text>
<text x="800" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">or quota exhausted</text>
<rect x="700" y="180" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect x="700" y="180" width="200" height="72" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="800" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod Pending</text>
<text x="800" y="230" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cannot be scheduled</text>
<rect x="380" y="180" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect x="380" y="180" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node autoscaler</text>
<text x="480" y="230" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">adds machines</text>
<text x="480" y="288" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" text-anchor="middle" font-style="italic">Watch Pending Pods and quota.</text>
</svg>
  </div>
</body>
</html>
