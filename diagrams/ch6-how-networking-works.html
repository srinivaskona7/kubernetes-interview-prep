    <h1>Pod networking: flat IPs plus Services, DNS and CNI</h1>

      <desc id="ch6-how-networking-works-desc">A client Pod resolves a Service name through CoreDNS and calls the Service IP. kube-proxy programs the node rules for Services, which send traffic to ready Pods. Ingress or Gateway brings outside traffic to the Service and the CNI plugin builds the Pod network.</desc>

rl(#arrow)"/><rect x="186" y="224" width="92" height="12" rx="2" fill="#f5f5f5"/><text x="232" y="233" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 CALL CLUSTERIP</text><path d="M672,244 L512,244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="573" y="224" width="39" height="12" rx="2" fill="#f5f5f5"/><text x="592" y="233" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTES</text><path d="M760,128 L760,160 Q760,168 752,168 L488,168 Q480,168 480,176 L480,208" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="579" y="148" width="82" height="12" rx="2" fill="#f5f5f5"/><text x="620" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROGRAMS RULES</text><path d="M400,280 L400,300 Q400,308 392,308 L280,308 Q272,308 272,316 L272,336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="309" y="288" width="55" height="12" rx="2" fill="#f5f5f5"/><text x="336" y="297" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENDPOINTS</text><path d="M464,280 L464,300 Q464,308 472,308 L584,308 Q592,308 592,316 L592,336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="501" y="288" width="55" height="12" rx="2" fill="#f5f5f5"/><text x="528" y="297" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENDPOINTS</text><path d="M800,368 L672,368" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="685" y="348" width="103" height="12" rx="2" fill="#f5f5f5"/><text x="736" y="357" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUILDS POD NETWORK</text><text x="32" y="432" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Every Pod has its own IP and can reach every other Pod without NAT. Services add a stable address on top.</text><text x="32" y="448" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">The CNI plugin builds the network for every Pod; its arrow is drawn once. Policies then restrict who may talk.</text><line x1="32" y1="464" x2="928" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="476" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="136" y="485" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">COMPONENT</text><rect x="218" y="476" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="242" y="485" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">STABLE SERVICE IP</text><line x1="369" y1="482" x2="397" y2="482" stroke="#4f5d75" stroke-width="1.2"/><text x="405" y="485" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TRAFFIC</text><line x1="476" y1="482" x2="504" y2="482" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/><text x="512" y="485" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">SETUP</text>
