<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whitebox versus blackbox monitoring</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Monitoring · Observability</p>
    <h1>Whitebox versus blackbox monitoring</h1>
    <svg viewBox="0 0 936 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch14-whitebox-blackbox-title ch14-whitebox-blackbox-desc">
      <title id="ch14-whitebox-blackbox-title">Whitebox versus blackbox monitoring</title>
      <desc id="ch14-whitebox-blackbox-desc">Whitebox monitoring scrapes metrics a service exposes about itself and explains why it broke. Blackbox monitoring probes the service from outside and shows whether it works for users.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="24" y="28" width="888" height="148" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/><text x="36" y="44" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHITEBOX: THE SYSTEM REPORTS ON ITSELF</text>
<rect x="24" y="196" width="888" height="148" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/><text x="36" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BLACKBOX: POKE IT FROM OUTSIDE, LIKE A USER</text>
<path d="M360,108 L256,108" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M568,108 L672,108" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M256,276 L360,276" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M568,276 L672,276" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="308" y="102" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCRAPES</text>
<text x="620" y="102" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXPLAINS</text>
<text x="308" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROBES</text>
<text x="620" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVEALS</text>
<text x="40" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">USE BOTH: BLACKBOX CATCHES TOTAL OUTAGES, WHITEBOX FINDS THE CAUSE</text>
<rect x="48" y="72" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="48" y="72" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="152.0" y="100.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service internals</text><text x="152.0" y="116.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">queue depth, error counters</text><text x="152.0" y="128.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">latency histograms</text>
<rect x="360" y="72" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="360" y="72" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="464.0" y="100.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prometheus</text><text x="464.0" y="116.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stores labelled series</text><text x="464.0" y="128.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">inside the cluster</text>
<rect x="672" y="72" width="216" height="72" rx="6" fill="#f5f5f5"/><rect x="672" y="72" width="216" height="72" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="780.0" y="106.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Why it is broken</text><text x="780.0" y="122.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the cause, from inside</text>
<rect x="48" y="240" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="48" y="240" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="152.0" y="268.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blackbox Exporter</text><text x="152.0" y="284.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP, TCP, ping probes</text><text x="152.0" y="296.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">runs outside the app</text>
<rect x="360" y="240" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="360" y="240" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="464.0" y="274.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service endpoint</text><text x="464.0" y="290.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">answers, or does not</text>
<rect x="672" y="240" width="216" height="72" rx="6" fill="#f5f5f5"/><rect x="672" y="240" width="216" height="72" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="780.0" y="274.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Does it work?</text><text x="780.0" y="290.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">as the user sees it</text>
<line x1="30" y1="376" x2="906" y2="376" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="30" y="392" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="384" width="12" height="12" rx="2" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="140" y="393" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL ANSWER</text><rect x="240.0" y="384" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="260.0" y="393" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">COMPONENT</text>
    </svg>
  </div>
</body>
</html>
