    <h1>A taint repels, a toleration only permits</h1>

      <title id="ch13-taints-and-tolerations-title">A taint repels, a toleration only permits</title>
      <desc id="ch13-taints-and-tolerations-desc">Two separate taints with different effects. NoSchedule blocks new Pods without a matching toleration and leaves running Pods alone. NoExecute also evicts running Pods that lack a toleration. A toleration allows a Pod onto a tainted node but does not attract it.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
