<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restore from a VolumeSnapshot</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
<body>
  <div class="frame">
    <p class="eyebrow">VolumeSnapshot</p>
    <h1>Restore from a VolumeSnapshot</h1>

    <svg viewBox="0 0 1000 216" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch15-snapshot-yaml-title ch15-snapshot-yaml-desc">
      <title id="ch15-snapshot-yaml-title">Restore from a VolumeSnapshot</title>
      <desc id="ch15-snapshot-yaml-desc">The snapshot names a PVC and class; restore creates a new PVC with a dataSource pointing at it.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect x="40" y="60" width="180" height="80" rx="6" fill="#f5f5f5"/><rect x="40" y="60" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="48" y="68" width="31" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="63.5" y="77" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SNAP</text><text x="130" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VolumeSnapshot</text><text x="130" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">source PVC + class</text><rect x="280" y="60" width="180" height="80" rx="6" fill="#f5f5f5"/><rect x="280" y="60" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="288" y="68" width="36" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="306.0" y="77" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READY</text><text x="370" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">readyToUse: true</text><text x="370" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the copy exists</text><rect x="520" y="60" width="180" height="80" rx="6" fill="#f5f5f5"/><rect x="520" y="60" width="180" height="80" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><rect x="528" y="68" width="26" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/><text x="541.0" y="77" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PVC</text><text x="610" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">New PVC</text><text x="610" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dataSource = snapshot</text><rect x="760" y="60" width="180" height="80" rx="6" fill="#f5f5f5"/><rect x="760" y="60" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="768" y="68" width="26" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="781.0" y="77" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text><text x="850" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fresh Pod</text><text x="850" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mounts the new claim</text><path d="M220 100 H280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M460 100 H520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M700 100 H760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="30" y1="180" x2="970" y2="180" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="30" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="120" y1="192" x2="148" y2="192" stroke="#4f5d75" stroke-width="1.2"/><text x="156" y="195" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flow</text><rect x="220" y="186" width="28" height="12" rx="2" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><text x="256" y="195" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">focal step</text>
    </svg>
  </div>
</body>
</html>
