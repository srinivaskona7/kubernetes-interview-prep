<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Behavioural stories</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Behavioural round</p>
    <h1>Behavioural stories</h1>

    <svg viewBox="0 0 880 204" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch18-behavioural-title ch18-behavioural-desc">
      <title id="ch18-behavioural-title">Behavioural stories</title>
      <desc id="ch18-behavioural-desc">Four prepared stories, each told in order: situation and task, action, result, lesson. Most time goes on the action and the result.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="24" y="32" width="168" height="104" rx="8" fill="#f5f5f5"/><rect x="24" y="32" width="168" height="104" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="108" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PREPARE</text><text x="108" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Four stories</text><text x="108" y="82" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">outage</text><text x="108" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">disagreement</text><text x="108" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">automation win</text><text x="108" y="124" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">honest failure</text><path d="M192,84 H232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="232" y="52" width="132" height="64" rx="8" fill="#f5f5f5"/><rect x="232" y="52" width="132" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="298" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 1</text><text x="298" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Situation, task</text><text x="298" y="102" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">keep it brief</text><path d="M364,84 H388" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="388" y="52" width="132" height="64" rx="8" fill="#f5f5f5"/><rect x="388" y="52" width="132" height="64" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="454" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 2</text><text x="454" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Action</text><text x="454" y="102" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">I for your decisions</text><path d="M520,84 H544" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="544" y="52" width="132" height="64" rx="8" fill="#f5f5f5"/><rect x="544" y="52" width="132" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="610" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 3</text><text x="610" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Result</text><text x="610" y="102" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">numbers if possible</text><path d="M676,84 H700" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="700" y="52" width="132" height="64" rx="8" fill="#f5f5f5"/><rect x="700" y="52" width="132" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="766" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 4</text><text x="766" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lesson</text><text x="766" y="102" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">what you would change</text><text x="466" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">spend most of the time on action and result</text><text x="466" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one story can answer several questions; keep it about the problem, not people</text>
    </svg>
  </div>
</body>
</html>
