<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thinking aloud under pressure</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Interview · Technical</p>
    <h1>Thinking aloud under pressure</h1>

    <svg viewBox="0 0 1000 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch17-think-aloud-title ch17-think-aloud-desc">
      <title id="ch17-think-aloud-title">Thinking aloud under pressure</title>
      <desc id="ch17-think-aloud-desc">The think-aloud loop: restate, rank hypotheses, run one check, say what each result means, then summarise; with branches for a missing fact and for realising you were wrong.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      
      <rect x="40" y="72" width="160" height="84" rx="6" fill="#f5f5f5"/><rect x="40" y="72" width="160" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="52" y="82" width="43" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="73" y="91" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 1</text><text x="52" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Restate</text><text x="52" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">say the symptom back</text><text x="52" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">buys thinking time</text>
<rect x="230" y="72" width="160" height="84" rx="6" fill="#f5f5f5"/><rect x="230" y="72" width="160" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="242" y="82" width="43" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="263" y="91" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 2</text><text x="242" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Hypothesise</text><text x="242" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">rank two or three</text><text x="242" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">likely causes</text>
<rect x="420" y="72" width="160" height="84" rx="6" fill="#f5f5f5"/><rect x="420" y="72" width="160" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="432" y="82" width="43" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="453" y="91" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 3</text><text x="432" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Check</text><text x="432" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">pick one command</text><text x="432" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">before you run it</text>
<rect x="610" y="72" width="160" height="84" rx="6" fill="#f5f5f5"/><rect x="610" y="72" width="160" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="622" y="82" width="43" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="643" y="91" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 4</text><text x="622" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Narrate</text><text x="622" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">say what each result</text><text x="622" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">would mean</text>
<rect x="800" y="72" width="160" height="84" rx="6" fill="#f5f5f5"/><rect x="800" y="72" width="160" height="84" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><rect x="812" y="82" width="43" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/><text x="833" y="91" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 5</text><text x="812" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Summarise</text><text x="812" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">cause, fix,</text><text x="812" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">prevention</text>
<rect x="230" y="204" width="340" height="84" rx="6" fill="#f5f5f5"/><rect x="230" y="204" width="340" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="242" y="214" width="52" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="268" y="223" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADMIT IT</text><text x="242" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Say the gap in one sentence</text><text x="242" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">then show adjacent knowledge: which</text><text x="242" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">object owns it, which command lists it</text>
<rect x="610" y="204" width="350" height="84" rx="6" fill="#f5f5f5"/><rect x="610" y="204" width="350" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="622" y="214" width="120" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="682" y="223" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REALISE YOU WERE WRONG</text><text x="622" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Correct yourself cleanly</text><text x="622" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">reads as senior, not weak</text><text x="622" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">never invent a flag or behaviour</text>
      <path d="M200,114 L230,114" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M390,114 L420,114" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M580,114 L610,114" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M770,114 L800,114" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M690,72 L690,56 Q690,48 682,48 L508,48 Q500,48 500,56 L500,72" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="595" y="40" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT HYPOTHESIS</text>
<path d="M500,156 L500,204" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="508" y="184" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">A FACT IS MISSING</text>
<path d="M690,156 L690,204" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="698" y="184" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">YOU WERE WRONG</text>
<text x="40" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Silence or bluffing shows nothing; method shows judgement.</text>
      <line x1="32" y1="344" x2="968" y2="344" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="120" y1="356" x2="148" y2="356" stroke="#4f5d75" stroke-width="1.2"/><text x="156" y="359" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flow</text><rect x="212" y="352" width="12" height="8" rx="2" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><text x="232" y="359" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">the finish</text>
    </svg>
  </div>
</body>
</html>
