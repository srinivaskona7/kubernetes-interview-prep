<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How to structure an answer</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Answering</p>
    <h1>How to structure an answer</h1>

    <!-- Replace ch18-answer-structure with a unique slug for this diagram before export. -->
    <svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch18-answer-structure-title ch18-answer-structure-desc">
      <title id="ch18-answer-structure-title">How to structure an answer</title>
      <desc id="ch18-answer-structure-desc">Flowchart of answering an interview question: clarify, then either give a define-how-limits answer or think aloud, and finish with a summary and check-in.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
        <!--
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        -->
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

      <line x1="200" y1="80" x2="240" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="400" y1="80" x2="440" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="600" y1="80" x2="680" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="760" y1="108" x2="760" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="520" y1="128" x2="520" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="600" y1="240" x2="680" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="626" y="60" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="640" y="69" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<rect x="528" y="164" width="24" height="12" rx="2" fill="#f5f5f5"/>
<text x="540" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<rect x="40" y="60" width="160" height="40" rx="20" fill="#f5f5f5"/>
<rect x="40" y="60" width="160" height="40" rx="20" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/>
<text x="120" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Question heard</text>
<rect x="240" y="52" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="240" y="52" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Clarify the scope</text>
<text x="320" y="94" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ask one or two questions</text>
<polygon points="520,32 600,80 520,128 440,80" fill="#f5f5f5"/>
<polygon points="520,32 600,80 520,128 440,80" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="520" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Know it</text>
<text x="520" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">well?</text>
<rect x="680" y="52" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="680" y="52" width="160" height="56" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="760" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Define, how, limits</text>
<text x="760" y="94" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">three-beat answer</text>
<rect x="440" y="212" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="440" y="212" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="520" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Think aloud</text>
<text x="520" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">known facts, then a guess</text>
<rect x="680" y="220" width="160" height="40" rx="20" fill="#f5f5f5"/>
<rect x="680" y="220" width="160" height="40" rx="20" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/>
<text x="760" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Summarise, check in</text>


    </svg>
  </div>
</body>
</html>
