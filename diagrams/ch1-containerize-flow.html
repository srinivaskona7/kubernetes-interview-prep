<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From Dockerfile to a running container</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Containers</p>
    <h1>From Dockerfile to a running container</h1>

    <svg viewBox="0 0 1000 184" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch1-containerize-flow-title ch1-containerize-flow-desc">
<title id="ch1-containerize-flow-title">From Dockerfile to a running container</title>
<desc id="ch1-containerize-flow-desc">Flow showing source code and a Dockerfile built into an image, pushed to a registry, pulled by a runtime and run as a container.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="176" y1="100" x2="236" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="186" y="80" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="206" y="89" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUILD</text>
<line x1="372" y1="100" x2="432" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="385" y="80" width="34" height="12" rx="2" fill="#f5f5f5"/>
<text x="402" y="89" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH</text>
<line x1="568" y1="100" x2="628" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="581" y="80" width="34" height="12" rx="2" fill="#f5f5f5"/>
<text x="598" y="89" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PULL</text>
<line x1="764" y1="100" x2="824" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="780" y="80" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="794" y="89" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN</text>
<rect x="40" y="64" width="136" height="72" rx="6" fill="#f5f5f5"/>
<rect x="40" y="64" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="108" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dockerfile + code</text>
<text x="108" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FROM, COPY, RUN</text>
<rect x="236" y="64" width="136" height="72" rx="6" fill="#f5f5f5"/>
<rect x="236" y="64" width="136" height="72" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="304" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container image</text>
<text x="304" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">read-only layers</text>
<rect x="432" y="64" width="136" height="72" rx="6" fill="#f5f5f5"/>
<rect x="432" y="64" width="136" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="500" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Registry</text>
<text x="500" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stores tagged images</text>
<rect x="628" y="64" width="136" height="72" rx="6" fill="#f5f5f5"/>
<rect x="628" y="64" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="696" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container runtime</text>
<text x="696" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">containerd, CRI-O</text>
<rect x="824" y="64" width="136" height="72" rx="6" fill="#f5f5f5"/>
<rect x="824" y="64" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="892" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Running container</text>
<text x="892" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one isolated process</text>
    </svg>
  </div>
</body>
</html>
