<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declarative and immutable versus imperative and in-place</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Comparison</p>
    <h1>Declarative and immutable versus imperative and in-place</h1>

    <svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch11-declarative-immutable-title ch11-declarative-immutable-desc">
      <title id="ch11-declarative-immutable-title">Declarative and immutable versus imperative and in-place</title>
      <desc id="ch11-declarative-immutable-desc">Two lanes: declarative immutable flow converging on the desired state versus imperative in-place steps that drift.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

<rect x="30" y="52" width="840" height="96" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="42" y="48" width="154" height="12" rx="2" fill="#f5f5f5"/>
<text x="119.0" y="57" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DECLARATIVE + IMMUTABLE</text>
<rect x="30" y="172" width="840" height="96" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="42" y="168" width="142" height="12" rx="2" fill="#f5f5f5"/>
<text x="113.0" y="177" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">IMPERATIVE + IN-PLACE</text>
<path d="M240,100 H340" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M540,100 H640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M240,220 H340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M540,220 H640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="273.6" y="81" width="32.8" height="12" rx="2" fill="#f5f5f5"/>
<text x="290" y="90" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DIFF</text>
<rect x="563.2" y="81" width="53.6" height="12" rx="2" fill="#f5f5f5"/>
<text x="590" y="90" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROLL OUT</text>
<rect x="276.2" y="201" width="27.6" height="12" rx="2" fill="#f5f5f5"/>
<text x="290" y="210" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN</text>
<rect x="573.6" y="201" width="32.8" height="12" rx="2" fill="#f5f5f5"/>
<text x="590" y="210" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EDIT</text>
<rect x="40" y="72" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="72" width="200" height="56" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="140" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Desired state in Git</text>
<text x="140" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">declare the end result</text>
<rect x="340" y="72" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="340" y="72" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tool computes steps</text>
<text x="440" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">safe to re-run</text>
<rect x="640" y="72" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="640" y="72" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="740" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">New image replaces old</text>
<text x="740" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nothing hand-modified</text>
<rect x="40" y="192" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="192" width="200" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="140" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ordered commands</text>
<text x="140" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">a recipe of steps</text>
<rect x="340" y="192" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="340" y="192" width="200" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="440" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Patch running container</text>
<text x="440" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">edited in place</text>
<rect x="640" y="192" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="640" y="192" width="200" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="740" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Configuration drift</text>
<text x="740" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">unknown live state</text>
<line x1="30" y1="332" x2="970" y2="332" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="30" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="120" y1="345" x2="144" y2="345" stroke="#4f5d75" stroke-width="1.2"/>
<text x="152" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">step</text>
<line x1="202" y1="345" x2="226" y2="345" stroke="#eb6c36" stroke-width="1.2"/>
<text x="234" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">focal flow</text>
<line x1="314" y1="345" x2="338" y2="345" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="346" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">watch or signal</text>

    </svg>
  </div>
</body>
</html>
