<!DOCTYPE html>

  <style>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

hor="middle">no node has room</text><rect x="600" y="64" width="144" height="72" rx="6" fill="#f5f5f5"/><rect x="600" y="64" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="672" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node autoscaler</text><text x="672" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Cluster Autoscaler or</text><text x="672" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Karpenter adds nodes</text><rect x="792" y="64" width="144" height="72" rx="6" fill="#f5f5f5"/><rect x="792" y="64" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="864" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pods scheduled</text><text x="864" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">capacity follows demand</text><rect x="600" y="208" width="144" height="72" rx="6" fill="#f5f5f5"/><rect x="600" y="208" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="672" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PDBs</text><text x="672" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">make scale-down safe</text><line x1="32" y1="316" x2="928" y2="316" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="328" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="136" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">STEP</text><rect x="192" y="328" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="216" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">SCALE-UP TRIGGER</text>
