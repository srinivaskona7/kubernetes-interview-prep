<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick a rollout by the question it answers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Choosing a strategy</p>
    <h1>Pick a rollout by the question it answers</h1>

    <svg viewBox="0 0 720 628" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="strategy-chooser-title strategy-chooser-desc">
      <title id="strategy-chooser-title">Pick a rollout by the question it answers</title>
      <desc id="strategy-chooser-desc">Decision flow that asks about acceptable downtime, instant rollback and zero-impact load testing to choose between recreate, blue-green, shadow, and rolling or canary releases.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

" stroke-width="1"/><text x="200" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Downtime acceptable?</text><polygon points="200,184 300,232 200,280 100,232" fill="#f5f5f5"/><polygon points="200,184 300,232 200,280 100,232" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="200" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Instant full rollback?</text><polygon points="200,328 300,376 200,424 100,376" fill="#f5f5f5"/><polygon points="200,328 300,376 200,424 100,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="200" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Real load, zero impact?</text><rect x="440" y="56" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="440" y="56" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="448" y="64" width="64" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.8" stroke-width="0.8"/><text x="480" y="73" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEV / TEST</text><text x="560" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Recreate</text><rect x="440" y="200" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="440" y="200" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="448" y="208" width="44" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.8" stroke-width="0.8"/><text x="470" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAFETY</text><text x="560" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blue-green</text><rect x="440" y="344" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="440" y="344" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="448" y="352" width="60" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.8" stroke-width="0.8"/><text x="478" y="361" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOAD TEST</text><text x="560" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shadow</text><rect x="100" y="472" width="200" height="80" rx="6" fill="#f5f5f5"/><rect x="100" y="472" width="200" height="80" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><rect x="108" y="480" width="48" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.8" stroke-width="0.8"/><text x="132" y="489" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEFAULT</text><text x="200" y="516" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rolling or canary</text><text x="200" y="532" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">canary if risk needs a test</text><line x1="30" y1="588" x2="690" y2="588" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="30" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="120" y1="600" x2="148" y2="600" stroke="#4f5d75" stroke-width="1.2"/><text x="156" y="603" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">decision path</text>
    </svg>
  </div>
</body>
</html>
