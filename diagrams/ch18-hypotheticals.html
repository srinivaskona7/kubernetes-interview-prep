<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Answering a hypothetical</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Answering</p>
    <h1>Answering a hypothetical</h1>

    <svg viewBox="0 0 880 208" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch18-hypotheticals-title ch18-hypotheticals-desc">
      <title id="ch18-hypotheticals-title">Answering a hypothetical</title>
      <desc id="ch18-hypotheticals-desc">Six steps for a hypothetical limits question: acknowledge it, then walk quota, scheduler, autoscaler and node pressure, and close with how real systems avoid it.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="24" y="56" width="120" height="76" rx="8" fill="#f5f5f5"/><rect x="24" y="56" width="120" height="76" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="84" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 1</text><text x="84" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Acknowledge</text><text x="84" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">it is a</text><text x="84" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hypothetical</text><path d="M144,94 H160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="160" y="56" width="120" height="76" rx="8" fill="#f5f5f5"/><rect x="160" y="56" width="120" height="76" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="220" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 2</text><text x="220" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quota</text><text x="220" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">caps the</text><text x="220" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">namespace</text><path d="M280,94 H296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="296" y="56" width="120" height="76" rx="8" fill="#f5f5f5"/><rect x="296" y="56" width="120" height="76" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="356" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 3</text><text x="356" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scheduler</text><text x="356" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">extra Pods</text><text x="356" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stay Pending</text><path d="M416,94 H432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="432" y="56" width="120" height="76" rx="8" fill="#f5f5f5"/><rect x="432" y="56" width="120" height="76" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="492" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 4</text><text x="492" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Autoscaler</text><text x="492" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">only up to</text><text x="492" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">set ceilings</text><path d="M552,94 H568" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="568" y="56" width="120" height="76" rx="8" fill="#f5f5f5"/><rect x="568" y="56" width="120" height="76" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="628" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 5</text><text x="628" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node pressure</text><text x="628" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">evictions, slow</text><text x="628" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">control plane</text><path d="M688,94 H704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="704" y="56" width="120" height="76" rx="8" fill="#f5f5f5"/><rect x="704" y="56" width="120" height="76" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="764" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 6</text><text x="764" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Close</text><text x="764" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">spread out,</text><text x="764" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">set limits</text><text x="440" y="164" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">walk the resource chain: each limit bites before the next one</text><text x="440" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">every Pod needs CPU, memory and a node, so the request is never unbounded</text>
    </svg>
  </div>
</body>
</html>
