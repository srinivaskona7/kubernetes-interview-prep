<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cluster Autoscaler up and down</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Autoscaling · Cluster level</p>
    <h1>Cluster Autoscaler up and down</h1>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M176,132 H232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<text x="596" y="121" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LAUNCH</text>

<rect x="36" y="96" width="140" height="72" rx="6" fill="#f5f5f5"/>
<rect x="36" y="96" width="140" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="106" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pending Pod</text>

<rect x="428" y="96" width="140" height="72" rx="6" fill="#f5f5f5"/>
<rect x="428" y="96" width="140" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

<rect x="820" y="96" width="140" height="72" rx="6" fill="#f5f5f5"/>
<rect x="820" y="96" width="140" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="890" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod Running</text>
<text x="890" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">bound by scheduler</text>
<rect x="232" y="272" width="140" height="72" rx="6" fill="#f5f5f5"/>

<text x="498" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Drain</text>
<text x="498" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">evict pods safely</text>

<rect x="624" y="272" width="140" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

<line x1="30" y1="376" x2="970" y2="376" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="30" y="392" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<line x1="120" y1="389" x2="144" y2="389" stroke="#4f5d75" stroke-width="1.2"/>
<text x="152" y="393" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">scale up</text>
<line x1="228" y1="389" x2="252" y2="389" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="260" y="393" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">scale down</text>
<rect x="346" y="384" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
<text x="378" y="393" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">decision maker</text>

  </div>
</body>
</html>
