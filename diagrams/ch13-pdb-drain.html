pace" text-anchor="middle">one Pod at a time</text><polygon points="480,224 560,268 480,312 400,268" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="480" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PDB allows?</text><text x="480" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">enough left</text><rect x="640" y="240" width="200" height="56" rx="6" fill="#f5f5f5"/><rect x="640" y="240" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="740" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod evicted</text><text x="740" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">recreated on another node</text><rect x="400" y="360" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="400" y="360" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Eviction refused</text><text x="480" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">API answers 429</text><rect x="660" y="360" width="160" height="40" rx="20" fill="#f5f5f5"/><rect x="660" y="360" width="160" height="40" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="740" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node drained</text><line x1="32" y1="444" x2="928" y2="444" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="456" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-w
