<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pod-level and node-level scaling</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">SCALING · TYPES</p>
    <h1>Pod-level and node-level scaling</h1>

    <svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch4-types-of-scaling-title ch4-types-of-scaling-desc">
<title id="ch4-types-of-scaling-title">Pod-level and node-level scaling</title>
<desc id="ch4-types-of-scaling-desc">kubectl, HPA and VPA change Pods; Pods that cannot be scheduled lead the node autoscaler to change the nodes.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="60" y="40" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="60" y="40" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="160.0" y="74.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kubectl scale</text><text x="160.0" y="90.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">by hand</text><rect x="60" y="152" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="60" y="152" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="160.0" y="186.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HPA</text><text x="160.0" y="202.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replicas from metrics</text><rect x="380" y="40" width="200" height="184" rx="6" fill="#f5f5f5"/><rect x="380" y="40" width="200" height="184" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480.0" y="130.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pods</text><text x="480.0" y="146.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">replica count and size</text><rect x="700" y="40" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="700" y="40" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="800.0" y="74.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VPA</text><text x="800.0" y="90.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resizes requests</text><rect x="700" y="152" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="700" y="152" width="200" height="72" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="800.0" y="186.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node autoscaler</text><text x="800.0" y="202.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">adds or removes machines</text><rect x="700" y="288" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="700" y="288" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="800.0" y="322.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nodes</text><text x="800.0" y="338.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">machines hosting Pods</text><path d="M260,76 H380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="277.6" y="70" width="84.8" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="79" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SETS REPLICAS</text><path d="M260,188 H380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="297.2" y="182" width="45.599999999999994" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="191" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCALES</text><path d="M700,76 H580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="614.4" y="70" width="51.199999999999996" height="12" rx="2" fill="#f5f5f5"/><text x="640" y="79" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESIZES</text><path d="M580,188 H700" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="600.4" y="182" width="79.19999999999999" height="12" rx="2" fill="#f5f5f5"/><text x="640" y="191" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PENDING PODS</text><path d="M800,224 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="812" y="260" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">ADDS / REMOVES</text><text x="480" y="396" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" text-anchor="middle" font-style="italic">Pod-level scalers change Pods; only a node autoscaler changes nodes.</text>
    </svg>
  </div>
</body>
</html>
