<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPO and RTO on a timeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Disaster recovery</p>
    <h1>RPO and RTO on a timeline</h1>

    <svg viewBox="0 0 1000 248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rto-rpo-title rto-rpo-desc">
      <title id="rto-rpo-title">RPO and RTO on a timeline</title>
      <desc id="rto-rpo-desc">Timeline from the last good backup to the disaster to restored service, where the first gap is the RPO and the second is the RTO.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <path d="M240 136 H400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="272" y="116" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RPO: DATA LOST</text><path d="M600 136 H760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="635" y="116" width="90" height="12" rx="2" fill="#f5f5f5"/><text x="680" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RTO: DOWNTIME</text><rect x="40" y="96" width="200" height="80" rx="6" fill="#f5f5f5"/><rect x="40" y="96" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="48" y="104" width="48" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="72" y="113" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BACKUP</text><text x="140" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Last good backup</text><text x="140" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">restore point</text><rect x="400" y="96" width="200" height="80" rx="6" fill="#f5f5f5"/><rect x="400" y="96" width="200" height="80" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><rect x="408" y="104" width="54" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/><text x="435" y="113" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FAILURE</text><text x="500" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Disaster strikes</text><text x="500" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">region or cluster lost</text><rect x="760" y="96" width="200" height="80" rx="6" fill="#f5f5f5"/><rect x="760" y="96" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="768" y="104" width="66" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="801" y="113" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECOVERED</text><text x="860" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service restored</text><text x="860" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">users served again</text><line x1="30" y1="216" x2="970" y2="216" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="30" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="120" y1="228" x2="148" y2="228" stroke="#4f5d75" stroke-width="1.2"/><text x="156" y="231" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">elapsed time</text>
    </svg>
  </div>
</body>
</html>
