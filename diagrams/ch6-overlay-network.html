<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay: a packet inside a packet</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Networking · Overlay</p>
    <h1>Overlay: a packet inside a packet</h1>
    <svg viewBox="0 0 960 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch6-overlay-network-title ch6-overlay-network-desc">
      <title id="ch6-overlay-network-title">Overlay: a packet inside a packet</title>
      <desc id="ch6-overlay-network-desc">Pod A sends an inner packet. Node 1 wraps it in an outer node-to-node packet, the physical network delivers it, Node 2 unwraps it and passes the inner packet to Pod B.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="32" y="64" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="32" y="64" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="136" y="97" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod A</text><text x="136" y="113" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">inner: Pod A IP to Pod B IP</text><rect x="376" y="64" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="376" y="64" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="97" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node 1</text><text x="480" y="113" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">adds outer header (VXLAN)</text><rect x="720" y="64" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="720" y="64" width="208" height="72" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="824" y="97" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Physical network</text><text x="824" y="113" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sees the outer header only</text><rect x="720" y="208" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="720" y="208" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="824" y="241" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node 2</text><text x="824" y="257" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">strips the outer header</text><rect x="376" y="208" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="376" y="208" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="241" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod B</text><text x="480" y="257" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gets the original inner packet</text><rect x="32" y="208" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="32" y="208" width="208" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="136" y="234" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trade-off</text><text x="136" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">header bytes and some CPU</text><text x="136" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BGP routing avoids both</text><path d="M240,100 L376,100" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="267" y="80" width="82" height="12" rx="2" fill="#f5f5f5"/><text x="308" y="89" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 INNER PACKET</text><path d="M584,100 L720,100" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="611" y="80" width="82" height="12" rx="2" fill="#f5f5f5"/><text x="652" y="89" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 OUTER PACKET</text><path d="M824,136 L824,208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="754" y="166" width="61" height="12" rx="2" fill="#f5f5f5"/><text x="784" y="175" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 DELIVERS</text><path d="M720,244 L584,244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="611" y="224" width="82" height="12" rx="2" fill="#f5f5f5"/><text x="652" y="233" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">4 INNER PACKET</text><text x="32" y="320" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Pod IPs need not be known to the physical network, and the overlay grows as nodes join.</text><text x="32" y="336" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Common encapsulations are VXLAN and GRE. Routed setups avoid wrapping but routers must learn Pod routes.</text><line x1="32" y1="392" x2="928" y2="392" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="412" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="404" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="136" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">HOP</text><rect x="184" y="404" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="208" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">UNDERLAY</text><rect x="284" y="404" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="308" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TRADE-OFF</text>
    </svg>
  </div>
</body>
</html>
