<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centralized logging pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Monitoring · Observability</p>
    <h1>Centralized logging pipeline</h1>
    <svg viewBox="0 0 936 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch14-logging-pipeline-title ch14-logging-pipeline-desc">
      <title id="ch14-logging-pipeline-title">Centralized logging pipeline</title>
      <desc id="ch14-logging-pipeline-desc">Containers write to stdout and stderr, the runtime stores files on the node, a DaemonSet agent on each node tails them and adds Kubernetes labels, forwards to a central store, and people search it through a query layer.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="24" y="28" width="744" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/><text x="36" y="44" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">1 · COLLECT, ON EVERY NODE</text>
<path d="M208,96 L308,96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M568,96 L468,96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M656,132 L656,232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M248,268 L568,268" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="258" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITES</text>
<text x="518" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TAILS</text>
<text x="664" y="186" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">2 FORWARDS</text>
<text x="408" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 QUERIES</text>
<text x="40" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">LOCAL LOGS DIE WITH THE POD, SO SHIP THEM OUT FIRST</text>
<rect x="48" y="60" width="160" height="72" rx="6" fill="#f5f5f5"/><rect x="48" y="60" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="128.0" y="88.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App container</text><text x="128.0" y="104.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stdout and stderr</text><text x="128.0" y="116.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">structured JSON</text>
<rect x="308" y="60" width="160" height="72" rx="6" fill="#f5f5f5"/><rect x="308" y="60" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="388.0" y="88.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node log files</text><text x="388.0" y="104.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/var/log/containers</text><text x="388.0" y="116.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">gone with the Pod</text>
<rect x="568" y="60" width="176" height="72" rx="6" fill="#f5f5f5"/><rect x="568" y="60" width="176" height="72" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="656.0" y="88.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Log agent</text><text x="656.0" y="104.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DaemonSet, one per node</text><text x="656.0" y="116.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">adds namespace, labels</text>
<rect x="568" y="232" width="176" height="72" rx="6" fill="#f5f5f5"/><rect x="568" y="232" width="176" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="656.0" y="260.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Central store</text><text x="656.0" y="276.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Loki, OpenSearch</text><text x="656.0" y="288.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">parse, mask, retain</text>
<rect x="48" y="232" width="200" height="72" rx="6" fill="#f5f5f5"/><rect x="48" y="232" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="148.0" y="260.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Search and alerts</text><text x="148.0" y="276.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Grafana or vendor UI</text><text x="148.0" y="288.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">filter, dashboard, alert</text>
<line x1="30" y1="372" x2="906" y2="372" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="30" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="380" width="12" height="12" rx="2" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="140" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL</text><rect x="205.0" y="380" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="225.0" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">COMPONENT</text><rect x="310.0" y="380" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="330.0" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">STORAGE</text>
    </svg>
  </div>
</body>
</html>
