    <h1>What kube-proxy does on every node</h1>

      <title id="ch6-what-is-kube-proxy-title">What kube-proxy does on every node</title>
      <desc id="ch6-what-is-kube-proxy-desc">kube-proxy watches Services and EndpointSlices from the API server and programs iptables or IPVS rules on its node. Traffic from a client Pod to a ClusterIP is rewritten by those kernel rules to one ready backend Pod.</desc>

2 L640,168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="565" y="194" width="66" height="12" rx="2" fill="#f5f5f5"/><text x="598" y="203" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 CLUSTERIP</text><path d="M728,108 L732,108 Q740,108 740,100 L740,96 Q740,88 748,88 L808,88" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="761" y="68" width="39" height="12" rx="2" fill="#f5f5f5"/><text x="780" y="77" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">4 DNAT</text><path d="M728,148 L732,148 Q740,148 740,156 L740,160 Q740,168 748,168 L808,168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="32" y="368" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">kube-proxy only writes the rules. The kernel moves the packets, so it is not in the data path.</text><text x="32" y="384" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Layer 4 only: one backend per connection, no HTTP paths or hostnames. Only ready Pods are in the rules.</text><line x1="32" y1="408" x2="928" y2="408" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="420" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="136" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">COMPONENT</text><rect x="218" y="420" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="242" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">KERNEL RULES</text><line x1="341" y1="426" x2="369" y2="426" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/><text
