<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kubernetes key features</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Features</p>
    <h1>Kubernetes key features</h1>

    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch1-key-features-title ch1-key-features-desc">
<title id="ch1-key-features-title">Kubernetes key features</title>
<desc id="ch1-key-features-desc">A desired state continuously enforced by Kubernetes leads to self-healing, load balancing, rollouts, autoscaling, persistent storage and operators.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M380 72 L280 72" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M380 210 L280 210" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M380 348 L280 348" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M620 72 L720 72" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M620 210 L720 210" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M620 348 L720 348" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="380" y="40" width="240" height="340" rx="6" fill="#f5f5f5"/>
<rect x="380" y="40" width="240" height="340" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="500" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Desired state</text>
<text x="500" y="226" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">continuously enforced</text>
<rect x="40" y="44" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="44" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="160" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Self-healing</text>
<text x="160" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">replaces failed containers</text>
<rect x="40" y="182" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="182" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="160" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Load balancing</text>
<text x="160" y="226" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">spreads traffic</text>
<rect x="40" y="320" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="320" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="160" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rollouts and rollbacks</text>
<text x="160" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pause, resume, undo</text>
<rect x="720" y="44" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="720" y="44" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="840" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Autoscaling</text>
<text x="840" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">horizontal, by metrics such as CPU</text>
<rect x="720" y="182" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="720" y="182" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="840" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Persistent volumes</text>
<text x="840" y="226" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">data outlives the container</text>
<rect x="720" y="320" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="720" y="320" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="840" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operators</text>
<text x="840" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">controllers that encode app knowledge</text>
    </svg>
  </div>
</body>
</html>
