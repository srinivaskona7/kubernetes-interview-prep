<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiteboard round</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Design round</p>
    <h1>Whiteboard round</h1>

    <svg viewBox="0 0 880 228" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch18-whiteboard-title ch18-whiteboard-desc">
      <title id="ch18-whiteboard-title">Whiteboard round</title>
      <desc id="ch18-whiteboard-desc">Four steps for a whiteboard round: gather requirements, draw the simplest design, stress it with scale and failure questions, then state trade-offs. A loop returns from stress to design to grow it.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="40" y="40" width="188" height="64" rx="8" fill="#f5f5f5"/><rect x="40" y="40" width="188" height="64" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="134" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 1</text><text x="134" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Requirements</text><text x="134" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">users, load, data, uptime</text><path d="M228,72 H244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="244" y="40" width="188" height="64" rx="8" fill="#f5f5f5"/><rect x="244" y="40" width="188" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="338" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 2</text><text x="338" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Simplest design</text><text x="338" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">talk through each box</text><path d="M432,72 H448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="448" y="40" width="188" height="64" rx="8" fill="#f5f5f5"/><rect x="448" y="40" width="188" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="542" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 3</text><text x="542" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stress it</text><text x="542" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">scale and failure</text><path d="M636,72 H652" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="652" y="40" width="188" height="64" rx="8" fill="#f5f5f5"/><rect x="652" y="40" width="188" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="746" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 4</text><text x="746" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trade-offs</text><text x="746" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">say them out loud</text><path d="M542,104 V132 Q542,140 534,140 H350 Q342,140 342,132 V104" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="362.5" y="134" width="167" height="14" fill="#f5f5f5"/><text x="446" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">where does it break? add a part</text><text x="440" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">a design without requirements is a guess; ask before you draw</text><text x="440" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cost vs resilience, simplicity vs flexibility: choose one and defend it</text>
    </svg>
  </div>
</body>
</html>
