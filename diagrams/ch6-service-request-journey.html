<!DOCTYPE html>

  <title>One Pod calls another through a Service name</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }

    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Networking · Request journey</p>
    <h1>One Pod calls another through a Service name</h1>
    <svg viewBox="0 0 960 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch6-service-request-journey-title ch6-service-request-journey-desc">
      <title id="ch6-service-request-journey-title">One Pod calls another through a Service name</title>
      <desc id="ch6-service-request-journey-desc">A client Pod resolves the Service name through CoreDNS, sends to the ClusterIP, kube-proxy rules on its node rewrite the destination to one backend Pod IP, the CNI network delivers it, and the reply returns with the source rewritten back.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="32" y="176" width="144" height="80" rx="6" fill="#f5f5f5"/><rect x="32" y="176" width="144" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="104" y="213" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client Pod</text><text x="104" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">calls web-svc</text><rect x="232" y="48" width="144" height="72" rx="6" fill="#f5f5f5"/><rect x="232" y="48" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="304" y="81" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CoreDNS</text><text x="304" y="97" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">answers names</text><rect x="264" y="176" width="176" height="80" rx="6" fill="#f5f5f5"/><rect x="264" y="176" width="176" height="80" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="352" y="213" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kube-proxy rules</text><text x="352" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">on the client's node</text><rect x="504" y="176" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="504" y="176" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="584" y="213" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CNI network</text><text x="584" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bridge, routes, overlay</text><rect x="728" y="176" width="144" height="80" rx="6" fill="#f5f5f5"/><rect x="728" y="176" width="144" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="800" y="213" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend Pod</text><text x="800" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one ready endpoint</text><path d="M88,176 L88,92 Q88,84 96,84 L232,84" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="143" y="64" width="50" height="12" rx="2" fill="#f5f5f5"/><text x="168" y="73" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 LOOKUP</text><path d="M232,108 L128,108 Q120,108 120,116 L120,176" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="151" y="116" width="66" height="12" rx="2" fill="#f5f5f5"/><text x="184" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 CLUSTERIP</text><path d="M176,216 L264,216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="187" y="196" width="66" height="12" rx="2" fill="#f5f5f5"/><text x="220" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 CLUSTERIP</text><path d="M440,216 L504,216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="453" y="196" width="39" height="12" rx="2" fill="#f5f5f5"/><text x="472" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">4 DNAT</text><path d="M664,216 L728,216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="674" y="196" width="45" height="12" rx="2" fill="#f5f5f5"/><text x="696" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">5 ROUTE</text><path d="M800,256 L800,304 Q800,312 792,312 L112,312 Q104,312 104,304 L104,256" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="369" y="292" width="167" height="12" rx="2" fill="#f5f5f5"/><text x="452" y="301" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">6 REPLY, SOURCE REWRITTEN BACK</text><text x="32" y="352" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Steps 1-2 are DNS, 3-4 are Service routing, 5 is delivery, 6 is the reply on the tracked connection.</text><text x="32" y="368" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">The load-balancing choice is made on the client's node. Debug in order: DNS, endpoints, Pod reachability.</text><line x1="32" y1="408" x2="928" y2="408" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="420" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="136" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">COMPONENT</text><rect x="218" y="420" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="242" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">SERVICE ROUTING</text><line x1="358" y1="426" x2="386" y2="426" stroke="#4f5d75" stroke-width="1.2"/><text x="394" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">REQUEST</text><line x1="465" y1="426" x2="493" y2="426" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/><text x="501" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">REPLY</text>
    </svg>
  </div>
