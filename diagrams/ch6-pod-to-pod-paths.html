<!DOCTYPE html>
<html lang="en">
<head>

  <title>Pod to Pod: same node versus another node</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Networking · Pod paths</p>
    <h1>Pod to Pod: same node versus another node</h1>
    <svg viewBox="0 0 960 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch6-pod-to-pod-paths-title ch6-pod-to-pod-paths-desc">
      <title id="ch6-pod-to-pod-paths-title">Pod to Pod: same node versus another node</title>
      <desc id="ch6-pod-to-pod-paths-desc">Pod A reaches Pod B on the same node through a virtual bridge. To reach Pod C on a second node, the packet leaves the bridge and is routed or tunnelled over the cluster network built by the CNI plugin.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

"144" width="128" height="72" rx="6" fill="#f5f5f5"/><rect x="600" y="144" width="128" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="664" y="177" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bridge</text><text x="664" y="193" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">virtual switch</text><rect x="808" y="144" width="112" height="72" rx="6" fill="#f5f5f5"/><rect x="808" y="144" width="112" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="864" y="177" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod C</text><text x="864" y="193" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">own IP, own netns</text><path d="M160,124 L288,124 Q296,124 296,132 L296,144" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="203" y="104" width="50" height="12" rx="2" fill="#f5f5f5"/><text x="228" y="113" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 POD IP</text><path d="M296,216 L296,236 Q296,244 288,244 L160,244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="195" y="252" width="66" height="12" rx="2" fill="#f5f5f5"/><text x="228" y="261" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 SAME NODE</text><path d="M360,180 L600,180" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><rect x="421" y="160" width="119" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 ROUTED OR TUNNELLED</text><path d="M728,180 L808,180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="741" y="160" width="55" height="12" rx="2" fill="#f5f5f5"/><text x="768" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">4 DELIVER</text><text x="32" y="336" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Pods always use each other's Pod IPs, with no NAT. The receiver sees the real source Pod IP.</text><text x="32" y="352" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Cross-node reachability comes from the CNI plugin. kube-proxy is not on this path.</text><line x1="32" y1="376" x2="928" y2="376" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="388" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="136" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">POD OR BRIDGE</text><line x1="240" y1="394" x2="268" y2="394" stroke="#4f5d75" stroke-width="1.2"/><text x="276" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">LOCAL PATH</text><line x1="364" y1="394" x2="392" y2="394" stroke="#eb6c36" stroke-width="1.2"/><text x="400" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CROSS-NODE PATH (CNI)</text>
