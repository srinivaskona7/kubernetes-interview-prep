<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Kubernetes replaces a crashed Pod</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Reconciliation</p>
    <h1>How Kubernetes replaces a crashed Pod</h1>

    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch1-self-healing-title ch1-self-healing-desc">
<title id="ch1-self-healing-title">How Kubernetes replaces a crashed Pod</title>
<desc id="ch1-self-healing-desc">Sequence showing a kubelet reporting a failed Pod, the controller manager creating a replacement through the API server, the scheduler binding it, and the kubelet starting it.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="140" y1="88" x2="140" y2="420" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="380" y1="88" x2="380" y2="420" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="620" y1="88" x2="620" y2="420" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="860" y1="88" x2="860" y2="420" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="860" y1="140" x2="620" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="706" y="120" width="68" height="12" rx="2" fill="#f5f5f5"/>
<text x="740" y="129" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POD FAILED</text>
<line x1="620" y1="188" x2="380" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="460" y="168" width="80" height="12" rx="2" fill="#f5f5f5"/>
<text x="500" y="177" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPLICAS 2/3</text>
<line x1="380" y1="236" x2="620" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="466" y="216" width="68" height="12" rx="2" fill="#f5f5f5"/>
<text x="500" y="225" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE POD</text>
<line x1="620" y1="284" x2="140" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="223" y="264" width="74" height="12" rx="2" fill="#f5f5f5"/>
<text x="260" y="273" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNBOUND POD</text>
<line x1="140" y1="332" x2="620" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="220" y="312" width="80" height="12" rx="2" fill="#f5f5f5"/>
<text x="260" y="321" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BIND TO NODE</text>
<line x1="620" y1="380" x2="860" y2="380" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="709" y="360" width="62" height="12" rx="2" fill="#f5f5f5"/>
<text x="740" y="369" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START POD</text>
<rect x="68" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/>
<rect x="68" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="140" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scheduler</text>
<text x="140" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">kube-scheduler</text>
<rect x="308" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/>
<rect x="308" y="40" width="144" height="48" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="380" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Controller manager</text>
<text x="380" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">reconcile loop</text>
<rect x="548" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/>
<rect x="548" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="620" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API server</text>
<text x="620" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">kube-apiserver</text>
<rect x="788" y="40" width="144" height="48" rx="6" fill="#f5f5f5"/>
<rect x="788" y="40" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="860" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kubelet</text>
<text x="860" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">on the worker node</text>
    </svg>
  </div>
</body>
</html>
