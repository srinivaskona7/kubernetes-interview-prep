      line-height: 1.15;

<desc id="ch16-policy-breaks-dns-desc">A default-deny egress policy has no rule for port 53, so queries from the app Pod never reach healthy CoreDNS and name lookups time out. Adding an egress rule to kube-system on port 53 restores them.</desc>

" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CoreDNS Pods</text><text x="648.0" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">healthy, never reached</text><text x="648.0" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">needs UDP and TCP 53</text><rect x="40" y="184" width="192" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="48" y="192" width="56" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="76.0" y="201" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYMPTOM</text><text x="136.0" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">nslookup times out</text><text x="136.0" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no servers reached</text><text x="136.0" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">database unreachable by name</text><rect x="296" y="184" width="192" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="304" y="192" width="32" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="320.0" y="201" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FIX</text><text x="392.0" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Allow DNS egress</text><text x="392.0" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">to kube-system, port 53</text><text x="392.0" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="
