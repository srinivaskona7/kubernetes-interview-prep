<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation from light to heavy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart</p>
    <h1>Validation from light to heavy</h1>
    <svg viewBox="0 0 960 328" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch12-schema-vs-webhook-validation-title ch12-schema-vs-webhook-validation-desc">
      <title id="ch12-schema-vs-webhook-validation-title">Validation from light to heavy</title>
      <desc id="ch12-schema-vs-webhook-validation-desc">A request meets OpenAPI schema validation, then CEL rules, then a validating webhook before it is stored; each step costs more to run.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="40" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="40" y="64" width="144" height="56" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="112" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenAPI schema</text><text x="112" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">types, enums, required</text><rect x="280" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="280" y="64" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="352" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CEL rules</text><text x="352" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">cross-field, in API server</text><rect x="520" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="520" y="64" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="592" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Webhook</text><text x="592" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">external data or code</text><rect x="760" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="760" y="64" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="832" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stored</text><text x="832" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">resource persisted</text><rect x="40" y="192" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="40" y="192" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="112" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cost: none</text><text x="112" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">no extra service</text><rect x="280" y="192" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="280" y="192" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="352" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cost: low</text><text x="352" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">evaluated in-process</text><rect x="520" y="192" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="520" y="192" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="592" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cost: highest</text><text x="592" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">run, secure, keep up</text><path d="M184,92 L280,92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="203" y="74" width="58" height="12" rx="2" fill="#f5f5f5"/><text x="232" y="83" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IF NEEDED</text><path d="M424,92 L520,92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="443" y="74" width="58" height="12" rx="2" fill="#f5f5f5"/><text x="472" y="83" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IF NEEDED</text><path d="M664,92 L760,92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="689" y="74" width="47" height="12" rx="2" fill="#f5f5f5"/><text x="712" y="83" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOWED</text><path d="M112,120 L112,192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="120" y="150" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="138" y="159" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRICE</text><path d="M352,120 L352,192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="360" y="150" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="378" y="159" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRICE</text><path d="M592,120 L592,192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="600" y="150" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="618" y="159" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRICE</text><line x1="32" y1="288" x2="928" y2="288" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="300" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">FOCAL</text><rect x="288" y="300" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="312" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">STEP</text><rect x="464" y="300" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="488" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">STORE</text>
    </svg>
  </div>
</body>
</html>
