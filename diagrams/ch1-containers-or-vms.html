<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Containers or VMs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Comparison · Decision</p>
    <h1>Containers or VMs</h1>

    <svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch1-containers-or-vms-title ch1-containers-or-vms-desc">
<title id="ch1-containers-or-vms-title">Containers or VMs</title>
<desc id="ch1-containers-or-vms-desc">A workload goes to containers for fast consistent scaling, to VMs for a different OS or whole-machine needs, and usually both are combined.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M300 96 L560 96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="386" y="86" width="88" height="12" rx="2" fill="#f5f5f5"/>
<text x="430" y="95" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MICROSERVICES</text>
<path d="M300 190 L560 190" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="402" y="180" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="430" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OTHER OS</text>
<path d="M300 284 L560 284" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="386" y="274" width="88" height="12" rx="2" fill="#f5f5f5"/>
<text x="430" y="283" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MOST CLUSTERS</text>
<rect x="60" y="60" width="240" height="260" rx="6" fill="#f5f5f5"/>
<rect x="60" y="60" width="240" height="260" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="180" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Workload</text>
<text x="180" y="206" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">what are you running?</text>
<rect x="560" y="60" width="340" height="72" rx="6" fill="#f5f5f5"/>
<rect x="560" y="60" width="340" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="730" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Containers</text>
<text x="730" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">consistency, efficiency, quick scale and deploy</text>
<rect x="560" y="154" width="340" height="72" rx="6" fill="#f5f5f5"/>
<rect x="560" y="154" width="340" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="730" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VMs</text>
<text x="730" y="206" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">other OS, full isolation, whole machine</text>
<rect x="560" y="248" width="340" height="72" rx="6" fill="#f5f5f5"/>
<rect x="560" y="248" width="340" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="730" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Both together</text>
<text x="730" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">containers running on VM nodes</text>
    </svg>
  </div>
</body>
</html>
