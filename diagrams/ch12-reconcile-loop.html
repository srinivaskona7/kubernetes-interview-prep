<!DOCTYPE html>

  <style>

roke-width="1"/><text x="110" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CR event arrives</text><text x="110" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">watch</text><rect x="240" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="320" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read desired spec</text><text x="320" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">from the CR</text><rect x="460" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="460" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="540" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Observe actual state</text><text x="540" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">Pods, Services</text><polygon points="468,232 540,184 612,232 540,280" fill="#f5f5f5"/><polygon points="468,232 540,184 612,232 540,280" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="540" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">In sync?</text><rect x="460" y="328" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="460" y="328" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="540" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Create or patch</text><text x="540" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">fix the difference</text><rect x="700" y="204" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="700" y="204" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="780" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write CR status</text><text x="780" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">report progress</text><line x1="32" y1="408" x2="928" y2="408" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="420" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">DECISION</text><rect x="288" y="420" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="312" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">STEP</text>
