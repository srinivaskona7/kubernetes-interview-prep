<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sealed Secrets versus External Secrets Operator</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Comparison</p>
    <h1>Sealed Secrets versus External Secrets Operator</h1>

    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch11-secrets-gitops-title ch11-secrets-gitops-desc">
      <title id="ch11-secrets-gitops-title">Sealed Secrets versus External Secrets Operator</title>
      <desc id="ch11-secrets-gitops-desc">Two lanes: an encrypted SealedSecret in Git decrypted by a cluster controller, versus an ExternalSecret pointer in Git resolved by an operator from an external store.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

<rect x="460" y="52" width="420" height="236" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="472" y="48" width="58" height="12" rx="2" fill="#f5f5f5"/>
<text x="501.0" y="57" fill="rgba(45,49,66,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLUSTER</text>
<path d="M200,108 H260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M420,108 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M640,108 H700" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M420,228 H480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M640,228 H700" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<path d="M560,320 V256" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="208.4" y="89" width="43.2" height="12" rx="2" fill="#f5f5f5"/>
<text x="230" y="98" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMMIT</text>
<rect x="425.8" y="89" width="48.4" height="12" rx="2" fill="#f5f5f5"/>
<text x="450" y="98" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLUSTER</text>
<rect x="645.8" y="89" width="48.4" height="12" rx="2" fill="#f5f5f5"/>
<text x="670" y="98" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DECRYPT</text>
<rect x="433.6" y="209" width="32.8" height="12" rx="2" fill="#f5f5f5"/>
<text x="450" y="218" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC</text>
<rect x="648.4" y="209" width="43.2" height="12" rx="2" fill="#f5f5f5"/>
<text x="670" y="218" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE</text>
<rect x="571" y="281" width="38" height="12" rx="2" fill="#f5f5f5"/>
<text x="590" y="290" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FETCH</text>
<rect x="40" y="80" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="80" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="120" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kubeseal CLI</text>
<text x="120" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">developer encrypts</text>
<rect x="260" y="80" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="260" y="80" width="160" height="56" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="340" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SealedSecret in Git</text>
<text x="340" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">encrypted in history</text>
<rect x="480" y="80" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="480" y="80" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="560" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Controller</text>
<text x="560" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">holds the private key</text>
<rect x="700" y="80" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="700" y="80" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="780" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Secret</text>
<text x="780" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">native, in cluster</text>
<rect x="260" y="200" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="260" y="200" width="160" height="56" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="340" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ExternalSecret in Git</text>
<text x="340" y="240" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pointer only</text>
<rect x="480" y="200" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="480" y="200" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="560" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">External Secrets Operator</text>
<text x="560" y="240" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">authenticates and fetches</text>
<rect x="700" y="200" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="700" y="200" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="780" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Secret</text>
<text x="780" y="240" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">native, in cluster</text>
<rect x="480" y="320" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="480" y="320" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="560" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vault or cloud store</text>
<text x="560" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">value never enters Git</text>
<line x1="30" y1="412" x2="970" y2="412" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="30" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="120" y1="425" x2="144" y2="425" stroke="#4f5d75" stroke-width="1.2"/>
<text x="152" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">step</text>
<line x1="202" y1="425" x2="226" y2="425" stroke="#eb6c36" stroke-width="1.2"/>
<text x="234" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">creates Secret</text>
<line x1="334" y1="425" x2="358" y2="425" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="366" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">fetch</text>

    </svg>
  </div>
</body>
</html>
