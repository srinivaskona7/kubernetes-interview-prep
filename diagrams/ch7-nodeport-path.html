<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodePort: same port on every node</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow</p>
    <h1>NodePort: same port on every node</h1>
    <svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch7-nodeport-path-title ch7-nodeport-path-desc">
      <title id="ch7-nodeport-path-title">NodePort: same port on every node</title>
      <desc id="ch7-nodeport-path-desc">An external client can hit the node port on any node; each node forwards to the ClusterIP, which selects a pod that runs on only one node.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M200,108 H300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M200,228 H300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M480,108 H580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M480,228 H580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M740,168 H820" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="80" width="160" height="176" rx="6" fill="#f5f5f5"/><rect x="40" y="80" width="160" height="176" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="120" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">External client</text><text x="120" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">node IP : 30080</text><rect x="300" y="80" width="180" height="56" rx="6" fill="#f5f5f5"/><rect x="300" y="80" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="390" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node A :30080</text><text x="390" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no matching pod</text><rect x="300" y="200" width="180" height="56" rx="6" fill="#f5f5f5"/><rect x="300" y="200" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="390" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node B :30080</text><text x="390" y="240" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">runs the pod</text><rect x="580" y="80" width="160" height="176" rx="6" fill="#f5f5f5"/><rect x="580" y="80" width="160" height="176" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="660" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ClusterIP</text><text x="660" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">selects a pod</text><rect x="820" y="140" width="100" height="56" rx="6" fill="#f5f5f5"/><rect x="820" y="140" width="100" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="870" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod</text><text x="870" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">on node B</text><line x1="32" y1="304" x2="928" y2="304" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="316" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">FOCAL</text><rect x="224" y="316" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="248" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">STEP</text>
    </svg>
  </div>
</body>
</html>
