    <h1>How a Pod resolves names in the cluster</h1>

      <desc id="ch6-dns-in-cluster-desc">A client Pod asks CoreDNS for a Service name. CoreDNS answers with the ClusterIP from records it builds by watching the API server, and forwards names outside the cluster domain to the upstream resolver.</desc>
