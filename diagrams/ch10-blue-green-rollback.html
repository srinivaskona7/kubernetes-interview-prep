<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue-green: instant rollback, shared data</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment strategy</p>
    <h1>Blue-green: instant rollback, shared data</h1>

    <svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch10-blue-green-rollback-title ch10-blue-green-rollback-desc">
      <title id="ch10-blue-green-rollback-title">Blue-green: instant rollback, shared data</title>
      <desc id="ch10-blue-green-rollback-desc">Service selector switched back from the failing green version to blue, which is still running, while both colours share one database that needs backward-compatible migrations.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect x="40" y="150" width="180" height="72" rx="6" fill="#f5f5f5"/><rect x="40" y="150" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="48" y="158" width="48" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.8" stroke-width="0.8"/><text x="72" y="167" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVICE</text><text x="130" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service selector</text><text x="130" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">points at one colour</text><rect x="380" y="50" width="220" height="72" rx="6" fill="#f5f5f5"/><rect x="380" y="50" width="220" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="388" y="58" width="32" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.8" stroke-width="0.8"/><text x="404" y="67" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BLUE</text><text x="490" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blue v1</text><text x="490" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">still running</text><rect x="380" y="250" width="220" height="72" rx="6" fill="#f5f5f5"/><rect x="380" y="250" width="220" height="72" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><rect x="388" y="258" width="37" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.8" stroke-width="0.8"/><text x="406.5" y="267" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GREEN</text><text x="490" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Green v2</text><text x="490" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">error rate spiking</text><rect x="720" y="150" width="240" height="72" rx="6" fill="#f5f5f5"/><rect x="720" y="150" width="240" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#8d99ae" stroke-width="1"/><rect x="728" y="158" width="42" height="12" rx="2" fill="transparent" stroke="#8d99ae" stroke-opacity="0.8" stroke-width="0.8"/><text x="749" y="167" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHARED</text><text x="840" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Database</text><text x="840" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">expand, then contract</text><path d="M220 170 H292 Q300 170 300 162 V94 Q300 86 308 86 H380" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><rect x="311" y="66" width="58" height="12" rx="2" fill="#f5f5f5"/><text x="340" y="75" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROLLBACK</text><path d="M220 202 H292 Q300 202 300 210 V278 Q300 286 308 286 H380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="323" y="266" width="34" height="12" rx="2" fill="#f5f5f5"/><text x="340" y="275" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIVE</text><path d="M600 86 H652 Q660 86 660 94 V162 Q660 170 668 170 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="670" y="150" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="690" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READS</text><path d="M600 286 H652 Q660 286 660 278 V210 Q660 202 668 202 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="667" y="182" width="46" height="12" rx="2" fill="#f5f5f5"/><text x="690" y="191" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITES</text><line x1="30" y1="340" x2="970" y2="340" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="30" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="120" y1="352" x2="148" y2="352" stroke="#4f5d75" stroke-width="1.2"/><text x="156" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flow</text><rect x="220" y="346" width="28" height="12" rx="2" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><text x="256" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">focal node</text>
    </svg>
  </div>
</body>
</html>
