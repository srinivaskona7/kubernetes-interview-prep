<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PV and PVC access modes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Comparison · Storage</p>
    <h1>PV and PVC access modes</h1>

    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch8-access-modes-title ch8-access-modes-desc">
<title id="ch8-access-modes-title">PV and PVC access modes</title>
<desc id="ch8-access-modes-desc">Four access modes and what each allows: ReadWriteOnce one node, ReadWriteOncePod one Pod, ReadOnlyMany many nodes read-only, ReadWriteMany many nodes read-write.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<polyline points="280,64 400,64" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="280,152 400,152" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="280,240 400,240" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="280,328 400,328" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="320" y="58" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="340" y="67" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCOPE</text>
<rect x="320" y="146" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="340" y="155" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCOPE</text>
<rect x="320" y="234" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="340" y="243" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCOPE</text>
<rect x="320" y="322" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="340" y="331" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCOPE</text>
<rect x="40" y="40" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="40" y="40" width="240" height="48" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="160" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ReadWriteOnce (RWO)</text>
<text x="160" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Cloud block disks</text>
<rect x="400" y="40" width="560" height="48" rx="6" fill="#f5f5f5"/>
<rect x="400" y="40" width="560" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="680" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One node; several Pods on that node can share it</text>
<rect x="40" y="128" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="40" y="128" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="160" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ReadWriteOncePod (RWOP)</text>
<text x="160" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Strict version of RWO</text>
<rect x="400" y="128" width="560" height="48" rx="6" fill="#f5f5f5"/>
<rect x="400" y="128" width="560" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="680" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One Pod in the whole cluster</text>
<rect x="40" y="216" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="40" y="216" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="160" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ReadOnlyMany (ROX)</text>
<text x="160" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Backend must support it</text>
<rect x="400" y="216" width="560" height="48" rx="6" fill="#f5f5f5"/>
<rect x="400" y="216" width="560" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="680" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Many nodes mount it, read only</text>
<rect x="40" y="304" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="40" y="304" width="240" height="48" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="160" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ReadWriteMany (RWX)</text>
<text x="160" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NFS-style file systems</text>
<rect x="400" y="304" width="560" height="48" rx="6" fill="#f5f5f5"/>
<rect x="400" y="304" width="560" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="680" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Many nodes mount it, read and write</text>
<text x="40" y="396" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', serif">RWO is about nodes, not Pods; the backend decides which modes are possible.</text>
    </svg>
  </div>
</body>
</html>
