<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four-week prep roadmap</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Four-week plan</p>
    <h1>Four-week prep roadmap</h1>

    <!-- Replace ch18-prep-roadmap with a unique slug for this diagram before export. -->
    <svg viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch18-prep-roadmap-title ch18-prep-roadmap-desc">
      <title id="ch18-prep-roadmap-title">Four-week prep roadmap</title>
      <desc id="ch18-prep-roadmap-desc">Roadmap of a four-week interview preparation plan: concepts, troubleshooting, mock rounds, then stories and polish, ending at the interview.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
        <!--
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        -->
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

      <line x1="172" y1="148" x2="204" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="344" y1="148" x2="376" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="516" y1="148" x2="548" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="688" y1="148" x2="720" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="32" y="100" width="140" height="96" rx="6" fill="#f5f5f5"/>
<rect x="32" y="100" width="140" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="102" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WEEK 1</text>
<text x="102" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Core concepts</text>
<text x="102" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pods, services, storage</text>
<text x="102" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">scheduling and limits</text>
<text x="102" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">say each in 30 seconds</text>
<rect x="204" y="100" width="140" height="96" rx="6" fill="#f5f5f5"/>
<rect x="204" y="100" width="140" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="274" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WEEK 2</text>
<text x="274" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Troubleshooting</text>
<text x="274" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pending, crash, evicted</text>
<text x="274" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">describe, events, logs</text>
<text x="274" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">drill one symptom a day</text>
<rect x="376" y="100" width="140" height="96" rx="6" fill="#f5f5f5"/>
<rect x="376" y="100" width="140" height="96" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="446" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WEEK 3</text>
<text x="446" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mock rounds</text>
<text x="446" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">debug live, talk aloud</text>
<text x="446" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">whiteboard one design</text>
<text x="446" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">get feedback, repeat</text>
<rect x="548" y="100" width="140" height="96" rx="6" fill="#f5f5f5"/>
<rect x="548" y="100" width="140" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="618" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WEEK 4</text>
<text x="618" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stories and polish</text>
<text x="618" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">four STAR stories</text>
<text x="618" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">questions to ask</text>
<text x="618" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">rest, logistics, review</text>
<rect x="720" y="128" width="160" height="40" rx="20" fill="#f5f5f5"/>
<rect x="720" y="128" width="160" height="40" rx="20" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="1"/>
<text x="800" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Interview day</text>


    </svg>
  </div>
</body>
</html>
