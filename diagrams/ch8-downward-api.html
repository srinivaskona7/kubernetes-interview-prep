<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Downward API: a Pod reads its own facts</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Pod metadata</p>
    <h1>The Downward API: a Pod reads its own facts</h1>

    <svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch8-downward-api-title ch8-downward-api-desc">
<title id="ch8-downward-api-title">The Downward API: a Pod reads its own facts</title>
<desc id="ch8-downward-api-desc">Pod fields reach a container through fieldRef environment variables set at start, or through downwardAPI volume files that refresh when labels change.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<polyline points="260,80 400,80" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="260,176 400,176" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="640,80 712,80 712,128 780,128" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="640,176 712,176 712,128 780,128" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="301.6" y="74" width="56.8" height="12" rx="2" fill="#f5f5f5"/>
<text x="330" y="83" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIELDREF</text>
<rect x="307.2" y="170" width="45.6" height="12" rx="2" fill="#f5f5f5"/>
<text x="330" y="179" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VOLUME</text>
<rect x="40" y="56" width="220" height="48" rx="6" fill="#f5f5f5"/>
<rect x="40" y="56" width="220" height="48" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="150" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod fields</text>
<text x="150" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">name, namespace, IP, node</text>
<rect x="40" y="152" width="220" height="48" rx="6" fill="#f5f5f5"/>
<rect x="40" y="152" width="220" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="150" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Labels and annotations</text>
<text x="150" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">from the Pod metadata</text>
<rect x="400" y="56" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="400" y="56" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="520" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Env var via fieldRef</text>
<text x="520" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Set once at container start</text>
<rect x="400" y="152" width="240" height="48" rx="6" fill="#f5f5f5"/>
<rect x="400" y="152" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="520" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">downwardAPI volume</text>
<text x="520" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Files refresh when labels change</text>
<rect x="780" y="104" width="180" height="48" rx="6" fill="#f5f5f5"/>
<rect x="780" y="104" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="870" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container</text>
<text x="870" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">reads its own identity</text>
<text x="40" y="296" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', serif">No API call and no RBAC needed for the app to learn who it is.</text>
    </svg>
  </div>
</body>
</html>
