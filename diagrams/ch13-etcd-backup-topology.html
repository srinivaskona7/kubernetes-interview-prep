<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacked versus external etcd, and backups</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture</p>
    <h1>Stacked versus external etcd, and backups</h1>
    <svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch13-etcd-backup-topology-title ch13-etcd-backup-topology-desc">
      <title id="ch13-etcd-backup-topology-title">Stacked versus external etcd, and backups</title>
      <desc id="ch13-etcd-backup-topology-desc">Stacked etcd runs beside the API server on one node, external etcd runs on its own machines, and in both cases scheduled snapshots are copied to storage outside the cluster.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="48" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">STACKED</text><text x="384" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">EXTERNAL</text><path d="M576,136 H672" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="606" y="130" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="624" y="139" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DATA</text><path d="M792,176 V256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="768" y="210" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="792" y="219" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BACKUP</text><path d="M672,296 H576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="606" y="290" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="624" y="299" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COPY</text><rect x="48" y="96" width="256" height="80" rx="6" fill="#f5f5f5"/><rect x="48" y="96" width="256" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="176" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Control plane node</text><text x="176" y="142" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">API server and etcd member together</text><text x="176" y="154" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">they fail together</text><rect x="384" y="96" width="192" height="80" rx="6" fill="#f5f5f5"/><rect x="384" y="96" width="192" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Control plane node</text><text x="480" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">API server only</text><rect x="672" y="96" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="672" y="96" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="792" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">etcd group</text><text x="792" y="142" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">own machines</text><text x="792" y="154" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fail and scale separately</text><rect x="672" y="256" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="672" y="256" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="792" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scheduled snapshot</text><text x="792" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">etcdctl snapshot save</text><rect x="384" y="256" width="192" height="80" rx="6" fill="#f5f5f5"/><rect x="384" y="256" width="192" height="80" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="480" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Off-cluster storage</text><text x="480" y="302" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">object storage, other location</text><text x="480" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">test the restore</text><rect x="48" y="256" width="256" height="80" rx="6" fill="#f5f5f5"/><rect x="48" y="256" width="256" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="176" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Replication is not a backup</text><text x="176" y="302" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">a deletion replicates to</text><text x="176" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">every member at once</text><line x1="32" y1="364" x2="928" y2="364" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="376" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="136" y="385" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">COMPONENT</text><rect x="220" y="376" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="244" y="385" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">BACKUP TARGET</text>
    </svg>
  </div>
