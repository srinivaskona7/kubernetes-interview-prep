<!DOCTYPE html>
<html lang="en">
<head>

  <title>What the Cluster Autoscaler does</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Autoscaling · Cluster Autoscaler</p>
    <h1>What the Cluster Autoscaler does</h1>

      <title id="ch5-ca-two-directions-title">What the Cluster Autoscaler does</title>
      <desc id="ch5-ca-two-directions-desc">Top lane: a Pending Pod makes the Cluster Autoscaler grow the node group. Bottom lane: an underused node that stays unneeded is drained and removed.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M190,108 L297,108 Q305,108 305,116 L305,152 Q305,160 313,160 L420,160" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

<path d="M190,260 L297,260 Q305,260 305,252 L305,216 Q305,208 313,208 L420,208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="193" y="243" width="111" height="12" rx="2" fill="#f5f5f5"/>
<text x="248" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">A UNNEEDED TOO LONG</text>

<rect x="40" y="72" width="150" height="72" rx="6" fill="#f5f5f5"/>

<text x="115.0" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pending Pod</text>
<text x="115.0" y="122" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no node has room</text>
<rect x="420" y="128" width="160" height="112" rx="6" fill="#f5f5f5"/>
<rect x="420" y="128" width="160" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="500.0" y="170" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cluster Autoscaler</text>
<text x="500.0" y="186" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">loops every ~10s</text>
<text x="500.0" y="198" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">reads Pod requests,</text>
<text x="500.0" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">not live usage</text>
<rect x="810" y="72" width="150" height="72" rx="6" fill="#f5f5f5"/>

<text x="115.0" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">its Pods fit elsewhere</text>
<rect x="810" y="224" width="150" height="72" rx="6" fill="#f5f5f5"/>
<rect x="810" y="224" width="150" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="885.0" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Remove node</text>
<text x="885.0" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">drain, then delete</text>
<text x="40" y="56" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">SCALE UP</text>
<text x="40" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">SCALE DOWN</text>
<line x1="30" y1="348" x2="970" y2="348" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="30" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="120" y1="361" x2="144" y2="361" stroke="#4f5d75" stroke-width="1.2"/>
<text x="152" y="365" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flow</text>
<rect x="208" y="356" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
<text x="240" y="365" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">focal node</text>
