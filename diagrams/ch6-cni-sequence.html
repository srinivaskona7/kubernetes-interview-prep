<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What happens when a Pod gets its network</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Networking · CNI</p>
    <h1>What happens when a Pod gets its network</h1>

    <!-- Replace ch6-cni-sequence with a unique slug for this diagram before export. -->
    <svg viewBox="0 0 1000 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch6-cni-sequence-title ch6-cni-sequence-desc">
      <title id="ch6-cni-sequence-title">What happens when a Pod gets its network</title>
      <desc id="ch6-cni-sequence-desc">Sequence of the kubelet, container runtime, CNI plugin and IPAM cooperating to give a new Pod an IP address before containers start.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
        <!--
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        -->
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

      <line x1="160" y1="88" x2="160" y2="468" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="400" y1="88" x2="400" y2="468" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="640" y1="88" x2="640" y2="468" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="880" y1="88" x2="880" y2="468" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<path d="M160,140 H400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="242" y="120" width="76" height="12" rx="2" fill="#f5f5f5"/>
<text x="280" y="129" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE POD</text>
<path d="M400,188 H640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="492" y="168" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="520" y="177" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CNI ADD</text>
<path d="M640,236 H880" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="722" y="216" width="76" height="12" rx="2" fill="#f5f5f5"/>
<text x="760" y="225" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST IP</text>
<path d="M880,284 H640" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
<rect x="720" y="264" width="80" height="12" rx="2" fill="#f5f5f5"/>
<text x="760" y="273" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IP ASSIGNED</text>
<path d="M640,332 H400" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="486" y="312" width="68" height="12" rx="2" fill="#f5f5f5"/>
<text x="520" y="321" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NET READY</text>
<path d="M400,380 H160" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="234" y="360" width="92" height="12" rx="2" fill="#f5f5f5"/>
<text x="280" y="369" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SANDBOX READY</text>
<path d="M160,428 H400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="246" y="408" width="68" height="12" rx="2" fill="#f5f5f5"/>
<text x="280" y="417" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START APP</text>
<rect x="88" y="24" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="88" y="24" width="144" height="56" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
<text x="160" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kubelet</text>
<text x="160" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">node agent</text>
<rect x="328" y="24" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="328" y="24" width="144" height="56" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
<text x="400" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Runtime</text>
<text x="400" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">containerd / cri-o</text>
<rect x="568" y="24" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="568" y="24" width="144" height="56" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="640" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CNI plugin</text>
<text x="640" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">executable binary</text>
<rect x="808" y="24" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="808" y="24" width="144" height="56" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
<text x="880" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IPAM</text>
<text x="880" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">address pool</text>
    </svg>
  </div>
</body>
</html>
