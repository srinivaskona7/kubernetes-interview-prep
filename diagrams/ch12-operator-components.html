<!DOCTYPE html>

<head>

  <title>Components of an Operator</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }

      <desc id="ch12-operator-components-desc">Custom resources trigger event handlers in the Operator, which wake the controller; the controller uses a client library to change objects, RBAC scopes its access and OLM installs the Operator.</desc>

-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">client-go or similar</text><rect x="760" y="216" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="760" y="216" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="832" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Objects</text><text x="832" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">children</text><rect x="520" y="216" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="520" y="216" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="592" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RBAC</text><text x="592" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">least privilege</text><rect x="280" y="216" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="280" y="216" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="352" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OLM</text><text x="352" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">installs, upgrades Operator</text><path d="M184,100 L280,100" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="214" y="82" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="232" y="91" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WATCH</text><path d="M424,100 L520,100" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="449" y="82" width="47" height="12" rx="2" fill="#f5f5f5"/><text x="472" y="9
