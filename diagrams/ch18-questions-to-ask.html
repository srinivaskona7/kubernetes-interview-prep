<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questions to ask</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Your questions</p>
    <h1>Questions to ask</h1>

    <svg viewBox="0 0 880 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch18-questions-to-ask-title ch18-questions-to-ask-desc">
      <title id="ch18-questions-to-ask-title">Questions to ask</title>
      <desc id="ch18-questions-to-ask-desc">Prepare five questions and ask two or three, drawn from day-to-day work, ownership, and the hardest current problem, then note the answers.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

x="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="364" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hardest problem</text><text x="364" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">and first months</text><path d="M464,52 H500 Q508,52 508,60 V120" fill="none" stroke="#4f5d75" stroke-width="1.2"/><path d="M464,188 H500 Q508,188 508,180 V120" fill="none" stroke="#4f5d75" stroke-width="1.2"/><path d="M464,120 H508" fill="none" stroke="#4f5d75" stroke-width="1.2"/><path d="M508,120 H556" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="556" y="88" width="152" height="64" rx="8" fill="#f5f5f5"/><rect x="556" y="88" width="152" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="632" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AFTER</text><text x="632" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Note answers</text><text x="632" y="138" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tie to what you heard</text><text x="440" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ask about problems, not only perks; skip what the careers page answers, and open with pay only if invited</text>
    </svg>
  </div>
</body>
</html>
