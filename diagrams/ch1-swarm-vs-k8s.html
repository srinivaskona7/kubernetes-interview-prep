<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm versus Kubernetes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Comparison · Orchestrators</p>
    <h1>Swarm versus Kubernetes</h1>

    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch1-swarm-vs-k8s-title ch1-swarm-vs-k8s-desc">
<title id="ch1-swarm-vs-k8s-title">Swarm versus Kubernetes</title>
<desc id="ch1-swarm-vs-k8s-desc">Docker Swarm is simple and Docker-only with no automatic rollback; Kubernetes is harder to set up but runtime-agnostic with a large ecosystem.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="60" y="40" width="400" height="56" rx="6" fill="#f5f5f5"/>
<rect x="60" y="40" width="400" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="260.0" y="66.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Docker Swarm</text>
<text x="260.0" y="82.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">simpler, built into Docker</text>
<rect x="540" y="40" width="400" height="56" rx="6" fill="#f5f5f5"/>
<rect x="540" y="40" width="400" height="56" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="740.0" y="66.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kubernetes</text>
<text x="740.0" y="82.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">more complex, far more featureful</text>
<rect x="60" y="136" width="400" height="64" rx="6" fill="#f5f5f5"/>
<rect x="60" y="136" width="400" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="260.0" y="166.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Setup in Swarm</text>
<text x="260.0" y="182.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Easy and quick, a couple of commands</text>
<rect x="540" y="136" width="400" height="64" rx="6" fill="#f5f5f5"/>
<rect x="540" y="136" width="400" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="740.0" y="166.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Setup in Kubernetes</text>
<text x="740.0" y="182.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Steeper: network plugin and ingress needed</text>
<rect x="60" y="228" width="400" height="64" rx="6" fill="#f5f5f5"/>
<rect x="60" y="228" width="400" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="260.0" y="258.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Runtime in Swarm</text>
<text x="260.0" y="274.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Docker Engine only</text>
<rect x="540" y="228" width="400" height="64" rx="6" fill="#f5f5f5"/>
<rect x="540" y="228" width="400" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="740.0" y="258.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Runtime in Kubernetes</text>
<text x="740.0" y="274.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Any CRI runtime, e.g. containerd</text>
<rect x="60" y="320" width="400" height="64" rx="6" fill="#f5f5f5"/>
<rect x="60" y="320" width="400" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="260.0" y="350.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Updates in Swarm</text>
<text x="260.0" y="366.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Rolling updates, no automatic rollback</text>
<rect x="540" y="320" width="400" height="64" rx="6" fill="#f5f5f5"/>
<rect x="540" y="320" width="400" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="740.0" y="350.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Updates in Kubernetes</text>
<text x="740.0" y="366.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Rolling updates with rollback, autoscaling</text>



    </svg>
  </div>
</body>
</html>
