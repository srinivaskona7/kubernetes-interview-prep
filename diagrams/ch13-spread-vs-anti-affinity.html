<!DOCTYPE html>

  <title>Topology spread or Pod anti-affinity</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Comparison</p>
    <h1>Topology spread or Pod anti-affinity</h1>

      <title id="ch13-spread-vs-anti-affinity-title">Topology spread or Pod anti-affinity</title>
      <desc id="ch13-spread-vs-anti-affinity-desc">Choose Pod anti-affinity for a strict never-together rule on a few Pods, and topology spread constraints for an even distribution of many replicas across zones and nodes.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M448,128 V160 Q448,168 440,168 H328 Q320,168 320,176 V224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="348" y="150" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="384" y="159" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FEW, STRICT</text><path d="M512,128 V160 Q512,168 520,168 H632 Q640,168 640,176 V224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="542" y="150" width="68" height="12" rx="2" fill="#f5f5f5"/><text x="576" y="159" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MANY, EVEN</text><path d="M320,288 V352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M640,288 V352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="400" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="400" y="64" width="160" height="64" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="480" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Which tool?</text><text x="480" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">replicas versus domains</text><rect x="240" y="224" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="240" y="224" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="320" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod anti-affinity</text><text x="320" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">not with matching Pods</text><rect x="560" y="224" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="560" y="224" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="640" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Topology spread</text><text x="640" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">counts within maxSkew</text><rect x="200" y="352" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="200" y="352" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="320" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Best for a few Pods</text><text x="320" y="398" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">that must never share a node</text><text x="320" y="410" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hard rule leaves extras Pending</text><rect x="520" y="352" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="520" y="352" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="640" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Best for replicated services</text><text x="640" y="398" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">even spread, keeps working</text><text x="640" y="410" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">as replicas outgrow domains</text><line x1="32" y1="460" x2="928" y2="460" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="472" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="481" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">DECISION</text><rect x="212" y="472" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="236" y="481" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">OPTION OR USE</text>
