<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stuck rollout: what to ask first</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Troubleshooting · Deployments</p>
    <h1>Stuck rollout: what to ask first</h1>

    <svg viewBox="0 0 1000 428" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch17-stuck-rollout-title ch17-stuck-rollout-desc">
      <title id="ch17-stuck-rollout-title">Stuck rollout: what to ask first</title>
      <desc id="ch17-stuck-rollout-desc">A stalled rollout is diagnosed by the state of the new Pods: Pending points to quota or surge, running but not Ready to the readiness probe, CrashLoopBackOff to the app; the fix is then confirmed with rollout status or undone.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      
      <rect x="40" y="158" width="148" height="56" rx="28" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="114.0" y="190.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rollout stalled</text>
<polygon points="320,138 400,186 320,234 240,186" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="320" y="184" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">New Pod</text><text x="320" y="198" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">state?</text>
<rect x="520" y="48" width="230" height="84" rx="6" fill="#f5f5f5"/><rect x="520" y="48" width="230" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="532" y="58" width="48" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="556" y="67" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PENDING</text><text x="532" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">No room for new Pods</text><text x="532" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">ResourceQuota hit by surge?</text><text x="532" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">maxSurge on a full cluster</text>
<rect x="520" y="144" width="230" height="84" rx="6" fill="#f5f5f5"/><rect x="520" y="144" width="230" height="84" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><rect x="532" y="154" width="100" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/><text x="582" y="163" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNNING, NOT READY</text><text x="532" y="182" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Probe or dependency</text><text x="532" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">readiness probe failing?</text><text x="532" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">missing Secret or backend</text>
<rect x="520" y="240" width="230" height="84" rx="6" fill="#f5f5f5"/><rect x="520" y="240" width="230" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="532" y="250" width="91" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="577" y="259" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRASHLOOPBACKOFF</text><text x="532" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">The app is failing</text><text x="532" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">read the new Pod logs</text><text x="532" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">bad config, Secret not applied</text>
<rect x="806" y="138" width="154" height="96" rx="6" fill="#f5f5f5"/><rect x="806" y="138" width="154" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="818" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Recover</text><text x="818" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">fix, then watch</text><text x="818" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">rollout status</text><text x="818" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">or rollout undo</text>
      <path d="M188,186 L240,186" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="214" y="178" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET PODS</text>
<path d="M320,138 L320,98 Q320,90 328,90 L520,90" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="420" y="82" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PENDING</text>
<path d="M400,186 L520,186" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="460" y="178" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOT READY</text>
<path d="M320,234 L320,274 Q320,282 328,282 L520,282" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="420" y="274" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRASHING</text>
<path d="M750,90 L770,90 Q778,90 778,98 L778,154 Q778,162 786,162 L806,162" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M750,186 L806,186" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M750,282 L770,282 Q778,282 778,274 L778,218 Q778,210 786,210 L806,210" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="40" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Stalling is protective: maxUnavailable 0 keeps old Pods until new ones are Ready.</text>
<text x="40" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">After progressDeadlineSeconds it reports Progressing=False; it does not roll back by itself.</text>
      <line x1="32" y1="400" x2="968" y2="400" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="120" y1="412" x2="148" y2="412" stroke="#4f5d75" stroke-width="1.2"/><text x="156" y="415" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flow</text><rect x="212" y="408" width="12" height="8" rx="2" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><text x="232" y="415" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">most likely</text>
    </svg>
  </div>
</body>
</html>
