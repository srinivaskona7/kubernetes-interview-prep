<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Six layers of cluster defense</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layers · Security</p>
    <h1>Six layers of cluster defense</h1>
    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch9-security-layers-title ch9-security-layers-desc">
      <title id="ch9-security-layers-title">Six layers of cluster defense</title>
      <desc id="ch9-security-layers-desc">Layer stack of six Kubernetes security layers from the image supply chain down to the workload, with identity and access highlighted.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect x="80" y="100" width="840" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="100" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
      <text x="148" y="124" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Supply chain</text>
      <text x="148" y="144" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">scan, sign and verify images</text>
      <text x="900" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">trivy image / cosign verify</text>
      <rect x="80" y="160" width="840" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="100" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="148" y="184" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Control plane</text>
      <text x="148" y="204" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">TLS, etcd protection, audit log</text>
      <text x="900" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">kube-apiserver flags</text>
      <rect x="80" y="220" width="840" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="100" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
      <text x="148" y="244" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Identity and access</text>
      <text x="148" y="264" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">authentication, RBAC, least privilege</text>
      <text x="900" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">Role / RoleBinding</text>
      <rect x="80" y="280" width="840" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="100" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
      <text x="148" y="304" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Network</text>
      <text x="148" y="324" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">NetworkPolicy and mutual TLS</text>
      <text x="900" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">default deny + allow rules</text>
      <rect x="80" y="340" width="840" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="100" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
      <text x="148" y="364" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Node and runtime</text>
      <text x="148" y="384" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">OS hardening, AppArmor, runtime alerts</text>
      <text x="900" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">CIS benchmark / Falco</text>
      <rect x="80" y="400" width="840" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="100" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L6</text>
      <text x="148" y="424" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Workload</text>
      <text x="148" y="444" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">securityContext, Pod Security, service accounts</text>
      <text x="900" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">runAsNonRoot / PSA</text>
      <text x="80" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OUTSIDE IN: EACH LAYER CATCHES WHAT THE ONE ABOVE MISSED</text>
    </svg>
  </div>
</body>
</html>
