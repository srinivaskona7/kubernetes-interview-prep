<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A typical interview loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · Interview loop</p>
    <h1>A typical interview loop</h1>

    <!-- Replace ch18-interview-loop with a unique slug for this diagram before export. -->
    <svg viewBox="0 0 920 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch18-interview-loop-title ch18-interview-loop-desc">
      <title id="ch18-interview-loop-title">A typical interview loop</title>
      <desc id="ch18-interview-loop-desc">Timeline of six common interview steps from recruiter screen through live debugging, design and behavioural rounds to the candidate's own questions.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
        <!--
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        -->
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

      <line x1="60" y1="160" x2="860" y2="160" stroke="#2d3142" stroke-width="1"/>
<line x1="100" y1="124" x2="100" y2="154" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="100" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 1</text>
<text x="100" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Recruiter screen</text>
<text x="100" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fit, basics, logistics</text>
<circle cx="100" cy="160" r="4" fill="#2d3142"/>
<line x1="240" y1="166" x2="240" y2="196" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="240" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 2</text>
<text x="240" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Technical screen</text>
<text x="240" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">core concepts, short Q&A</text>
<circle cx="240" cy="160" r="4" fill="#2d3142"/>
<line x1="380" y1="124" x2="380" y2="154" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="380" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 3</text>
<text x="380" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Live debugging</text>
<text x="380" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">broken cluster, talk aloud</text>
<circle cx="380" cy="160" r="6" fill="#eb6c36"/>
<line x1="520" y1="166" x2="520" y2="196" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="520" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 4</text>
<text x="520" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Design round</text>
<text x="520" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">whiteboard a system</text>
<circle cx="520" cy="160" r="4" fill="#2d3142"/>
<line x1="660" y1="124" x2="660" y2="154" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="660" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 5</text>
<text x="660" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Behavioural round</text>
<text x="660" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stories with results</text>
<circle cx="660" cy="160" r="4" fill="#2d3142"/>
<line x1="800" y1="166" x2="800" y2="196" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="800" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 6</text>
<text x="800" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Your questions</text>
<text x="800" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">close and follow up</text>
<circle cx="800" cy="160" r="4" fill="#2d3142"/>
<text x="460" y="296" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Typical loop, not to scale. Formats vary by team.</text>


    </svg>
  </div>
</body>
</html>
