<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The smallest valid cluster</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Comparison · Minimum cluster</p>
    <h1>The smallest valid cluster</h1>

    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch1-minimum-cluster-title ch1-minimum-cluster-desc">
<title id="ch1-minimum-cluster-title">The smallest valid cluster</title>
<desc id="ch1-minimum-cluster-desc">A control plane alone runs but leaves Pods Pending; adding a worker node lets them run; managed services take over only control plane operations.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M300 92 L380 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="324" y="82" width="32" height="12" rx="2" fill="#f5f5f5"/>
<text x="340" y="91" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NONE</text>
<path d="M620 92 L700 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="638" y="82" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="660" y="91" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>
<path d="M300 222 L380 222" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="327" y="212" width="26" height="12" rx="2" fill="#f5f5f5"/>
<text x="340" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADD</text>
<path d="M620 222 L700 222" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="638" y="212" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="660" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>
<path d="M300 352 L380 352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="318" y="342" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="340" y="351" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OFFERS</text>
<path d="M620 352 L700 352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="638" y="342" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="660" y="351" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEAVES</text>
<rect x="60" y="60" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="60" y="60" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="180" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Control plane</text>
<text x="180" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">API server, scheduler</text>
<rect x="380" y="60" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="380" y="60" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">No worker node</text>
<text x="500" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cluster is valid but empty</text>
<rect x="700" y="60" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="700" y="60" width="240" height="64" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="820" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod: Pending</text>
<text x="820" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nowhere to run</text>
<rect x="60" y="190" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="60" y="190" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="180" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Control plane</text>
<text x="180" y="238" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">API server, scheduler</text>
<rect x="380" y="190" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="380" y="190" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Worker node</text>
<text x="500" y="238" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">added to the cluster</text>
<rect x="700" y="190" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="700" y="190" width="240" height="64" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="820" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod: Running</text>
<text x="820" y="238" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">scheduled onto the node</text>
<rect x="60" y="320" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="60" y="320" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="180" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Managed service</text>
<text x="180" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">provider-run offering</text>
<rect x="380" y="320" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="380" y="320" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Takes over</text>
<text x="500" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">control plane operations</text>
<rect x="700" y="320" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="700" y="320" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="820" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Still yours</text>
<text x="820" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">workloads and worker nodes</text>
    </svg>
  </div>
</body>
</html>
