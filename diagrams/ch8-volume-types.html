<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volume types and how long each one lives</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Comparison · Storage</p>
    <h1>Volume types and how long each one lives</h1>

    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch8-volume-types-title ch8-volume-types-desc">
<title id="ch8-volume-types-title">Volume types and how long each one lives</title>
<desc id="ch8-volume-types-desc">A Pod mounts five kinds of volume: emptyDir, hostPath or local, PVC, network volume, and ConfigMap or Secret, each with a different lifetime.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<polyline points="240,216 300,216 300,64 360,64" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="240,216 300,216 300,140 360,140" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="240,216 360,216" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="240,216 300,216 300,292 360,292" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="240,216 300,216 300,368 360,368" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="192" width="200" height="48" rx="6" fill="#f5f5f5"/>
<rect x="40" y="192" width="200" height="48" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="140" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod</text>
<text x="140" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">mountPath in each container</text>
<rect x="360" y="40" width="280" height="48" rx="6" fill="#f5f5f5"/>
<rect x="360" y="40" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">emptyDir</text>
<text x="500" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Scratch space, deleted with the Pod</text>
<rect x="360" y="116" width="280" height="48" rx="6" fill="#f5f5f5"/>
<rect x="360" y="116" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hostPath / local</text>
<text x="500" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">A directory on one specific node</text>
<rect x="360" y="192" width="280" height="48" rx="6" fill="#f5f5f5"/>
<rect x="360" y="192" width="280" height="48" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="500" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PersistentVolumeClaim</text>
<text x="500" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Durable, independent of the Pod</text>
<rect x="360" y="268" width="280" height="48" rx="6" fill="#f5f5f5"/>
<rect x="360" y="268" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NFS and network volumes</text>
<text x="500" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Shared by Pods on different nodes</text>
<rect x="360" y="344" width="280" height="48" rx="6" fill="#f5f5f5"/>
<rect x="360" y="344" width="280" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ConfigMap / Secret / downwardAPI</text>
<text x="500" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Configuration delivered as files</text>
<text x="40" y="416" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', serif">Every type ends up as a path in the container; they differ in lifetime and location.</text>
    </svg>
  </div>
</body>
</html>
