<!DOCTYPE html>
<html lang="en">
<head>

  <title>From Service selector to a pod</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }

    .frame { max-width:1200px; width:100%; }

    svg { width:100%; min-width:900px; display:block; }
  </style>

<body>
  <div class="frame">
    <p class="eyebrow">Flow</p>

      <title id="ch7-service-to-pod-title">From Service selector to a pod</title>
      <desc id="ch7-service-to-pod-desc">Labels produce an endpoint list, kube-proxy on each node turns it into packet rules, and a client connection to the Service IP is rewritten to one ready pod.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M240,80 H380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="289" y="57" width="42" height="12" rx="2" fill="#f5f5f5"/><text x="310" y="66" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">builds</text><path d="M580,80 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="618" y="57" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="650" y="66" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">watched by</text><path d="M820,108 V148 Q820,156 812,156 H488 Q480,156 480,164 V204" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="613" y="133" width="74" height="12" rx="2" fill="#f5f5f5"/><text x="650" y="142" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">writes rules</text><path d="M200,260 H380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M580,228 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M580,292 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="52" width="200" height="56" rx="6" fill="#f5f5f5"/><rect x="40" y="52" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="140" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service selector</text><text x="140" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">label match</text><rect x="380" y="52" width="200" height="56" rx="6" fill="#f5f5f5"/><rect x="380" y="52" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EndpointSlice</text><text x="480" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ready pod IPs and ports</text><rect x="720" y="52" width="200" height="56" rx="6" fill="#f5f5f5"/><rect x="720" y="52" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="820" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kube-proxy</text><text x="820" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">watches on every node</text><rect x="40" y="232" width="160" height="56" rx="6" fill="#f5f5f5"/><rect x="40" y="232" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="120" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client pod</text><text x="120" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">connects to ClusterIP</text><rect x="380" y="204" width="200" height="112" rx="6" fill="#f5f5f5"/><rect x="380" y="204" width="200" height="112" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="480" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node rules</text><text x="480" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">iptables or IPVS</text><rect x="720" y="200" width="200" height="56" rx="6" fill="#f5f5f5"/><rect x="720" y="200" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="820" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod A</text><text x="820" y="240" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">destination rewritten</text><rect x="720" y="264" width="200" height="56" rx="6" fill="#f5f5f5"/><rect x="720" y="264" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="820" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod B</text><text x="820" y="304" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">per-connection choice</text><line x1="32" y1="364" x2="928" y2="364" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="376" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="385" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">FOCAL</text><rect x="224" y="376" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="248" y="385" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">STEP</text>
    </svg>
