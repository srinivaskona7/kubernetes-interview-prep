<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMs vs containers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layers · Isolation</p>
    <h1>VMs vs containers</h1>

    <svg viewBox="0 0 1000 368" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch1-vm-vs-container-title ch1-vm-vs-container-desc">
<title id="ch1-vm-vs-container-title">VMs vs containers</title>
<desc id="ch1-vm-vs-container-desc">Two layer stacks: virtual machines each carry a guest operating system above a hypervisor, while containers share one host kernel under a container runtime.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        </defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="40" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VIRTUAL MACHINES</text>
<rect x="40" y="100" width="420" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="100" width="420" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="250" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App + libraries</text>
<text x="250" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one set per VM</text>
<rect x="40" y="164" width="420" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="164" width="420" height="56" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="250" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Guest OS in every VM</text>
<text x="250" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">full kernel each, minutes to boot</text>
<rect x="40" y="228" width="420" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="228" width="420" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="250" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hypervisor</text>
<text x="250" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">virtual hardware</text>
<rect x="40" y="292" width="420" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="292" width="420" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="250" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Physical hardware</text>
<text x="540" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CONTAINERS</text>
<rect x="540" y="100" width="420" height="56" rx="6" fill="#f5f5f5"/>
<rect x="540" y="100" width="420" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="750" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App + libraries</text>
<text x="750" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one set per container</text>
<rect x="540" y="164" width="420" height="56" rx="6" fill="#f5f5f5"/>
<rect x="540" y="164" width="420" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="750" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container runtime</text>
<text x="750" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">starts isolated processes</text>
<rect x="540" y="228" width="420" height="56" rx="6" fill="#f5f5f5"/>
<rect x="540" y="228" width="420" height="56" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="750" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shared host OS kernel</text>
<text x="750" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one kernel for all, seconds to start</text>
<rect x="540" y="292" width="420" height="56" rx="6" fill="#f5f5f5"/>
<rect x="540" y="292" width="420" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="750" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Physical hardware</text>
    </svg>
  </div>
</body>
</html>
