<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross-namespace traffic</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Troubleshooting · Network policy</p>
    <h1>Cross-namespace traffic</h1>

    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch17-cross-namespace-title ch17-cross-namespace-desc">
      <title id="ch17-cross-namespace-title">Cross-namespace traffic</title>
      <desc id="ch17-cross-namespace-desc">A client Pod in one namespace resolves a Service name through CoreDNS, then connects to a Pod in another namespace; egress and ingress NetworkPolicies and the network plugin decide whether the connection is allowed.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect x="40" y="48" width="260" height="256" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/><text x="52" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NAMESPACE: FRONTEND</text>
<rect x="700" y="48" width="260" height="256" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="4,4"/><text x="712" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NAMESPACE: BACKEND</text>
      <rect x="64" y="84" width="212" height="72" rx="6" fill="#f5f5f5"/><rect x="64" y="84" width="212" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="76" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Client Pod</text><text x="76" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">curl database.backend</text><text x="76" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">timeout or refused?</text>
<rect x="64" y="212" width="212" height="84" rx="6" fill="#f5f5f5"/><rect x="64" y="212" width="212" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="76" y="222" width="67" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="109" y="231" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE SIDE</text><text x="76" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Egress policy</text><text x="76" y="266" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">if restricted, it must</text><text x="76" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">allow the backend</text>
<rect x="340" y="56" width="320" height="72" rx="6" fill="#f5f5f5"/><rect x="340" y="56" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="352" y="82" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">1 · CoreDNS</text><text x="352" y="98" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">database.backend.svc.cluster.local</text><text x="352" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">fails = name or CoreDNS fault</text>
<rect x="724" y="84" width="212" height="72" rx="6" fill="#f5f5f5"/><rect x="724" y="84" width="212" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="736" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">database Service</text><text x="736" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Pods listening?</text><text x="736" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">refused = nothing listens</text>
<rect x="724" y="212" width="212" height="84" rx="6" fill="#f5f5f5"/><rect x="724" y="212" width="212" height="84" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><rect x="736" y="222" width="91" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/><text x="781" y="231" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DESTINATION SIDE</text><text x="736" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Ingress policy</text><text x="736" y="266" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">default-deny blocks all;</text><text x="736" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">allow by namespaceSelector</text>
<rect x="340" y="212" width="320" height="84" rx="6" fill="#f5f5f5"/><rect x="340" y="212" width="320" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="352" y="222" width="86" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="395" y="231" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">3 · ENFORCEMENT</text><text x="352" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Network plugin (CNI)</text><text x="352" y="266" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">enforces what policy denies</text><text x="352" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">no support = silently ignored</text>
      <path d="M276,92 L340,92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="308" y="84" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NAME</text>
<path d="M276,148 L724,148" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="420" y="166" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 · CONNECT</text>
<path d="M500,212 L500,148" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="508" y="196" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">FILTERS</text>
<path d="M170,212 L170,156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="178" y="190" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">GUARDS EGRESS</text>
<path d="M830,212 L830,156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="838" y="190" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">GUARDS INGRESS</text>
<text x="40" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Both sides must allow the flow when both are restricted.</text>
<text x="40" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Timeout with working DNS suggests a policy drop; refused means nothing is listening.</text>
      <line x1="32" y1="372" x2="968" y2="372" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="120" y1="384" x2="148" y2="384" stroke="#4f5d75" stroke-width="1.2"/><text x="156" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flow</text><rect x="212" y="380" width="12" height="8" rx="2" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><text x="232" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">default-deny drops here</text>
    </svg>
  </div>
</body>
</html>
