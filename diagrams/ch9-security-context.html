<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>securityContext: pod level, then container level</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Workload security</p>
    <h1>securityContext: pod level, then container level</h1>

    <svg viewBox="0 0 1000 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch9-security-context-title ch9-security-context-desc">
      <title id="ch9-security-context-title">securityContext: pod level, then container level</title>
      <desc id="ch9-security-context-desc">Pod-level security settings apply to every container, container-level settings override them, and the key container settings are non-root, dropped capabilities, read-only filesystem and no privilege escalation.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <path d="M560 66 L680 66" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M560 150 L680 150" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M560 234 L680 234" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M560 318 L680 318" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M240 188 L360 188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="256.5" y="170" width="87" height="12" rx="2" fill="#f5f5f5"/><text x="300" y="179" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OVERRIDDEN BY</text><rect x="40" y="140" width="200" height="96" rx="6" fill="#f5f5f5"/><rect x="40" y="140" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="48" y="148" width="58" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="77" y="157" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD LEVEL</text><text x="140" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">spec.securityContext</text><text x="140" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runAsUser, fsGroup</text><text x="140" y="205" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sysctls</text><rect x="360" y="40" width="200" height="296" rx="6" fill="#f5f5f5"/><rect x="360" y="40" width="200" height="296" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><rect x="368" y="48" width="58" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/><text x="397" y="57" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONTAINER</text><text x="460" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">containers[].securityContext</text><text x="460" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">overrides pod level</text><text x="460" y="205" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">for that container</text><rect x="680" y="40" width="280" height="52" rx="6" fill="#f5f5f5"/><rect x="680" y="40" width="280" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="688" y="48" width="31" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="703.5" y="57" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text><text x="820" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">runAsNonRoot: true</text><text x="820" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">numeric runAsUser</text><rect x="680" y="124" width="280" height="52" rx="6" fill="#f5f5f5"/><rect x="680" y="124" width="280" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="688" y="132" width="31" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="703.5" y="141" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAPS</text><text x="820" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">capabilities: drop ALL</text><text x="820" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">add back only what is needed</text><rect x="680" y="208" width="280" height="52" rx="6" fill="#f5f5f5"/><rect x="680" y="208" width="280" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="688" y="216" width="36" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="706" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILES</text><text x="820" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">readOnlyRootFilesystem: true</text><text x="820" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">blocks tampering</text><rect x="680" y="292" width="280" height="52" rx="6" fill="#f5f5f5"/><rect x="680" y="292" width="280" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="688" y="300" width="52" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="714" y="309" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ESCALATE</text><text x="820" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">allowPrivilegeEscalation: false</text><text x="820" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">avoid privileged: true</text><line x1="30" y1="376" x2="970" y2="376" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="30" y="392" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="120" y1="388" x2="148" y2="388" stroke="#4f5d75" stroke-width="1.2"/><text x="156" y="391" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">applies to</text><rect x="246" y="382" width="28" height="12" rx="2" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><text x="282" y="391" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">container-level settings win</text>
    </svg>
  </div>
</body>
</html>
