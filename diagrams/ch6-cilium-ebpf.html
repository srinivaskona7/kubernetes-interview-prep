<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iptables scan versus eBPF lookup</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Networking · Cilium</p>
    <h1>iptables scan versus eBPF lookup</h1>
    <svg viewBox="0 0 960 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch6-cilium-ebpf-title ch6-cilium-ebpf-desc">
      <title id="ch6-cilium-ebpf-title">iptables scan versus eBPF lookup</title>
      <desc id="ch6-cilium-ebpf-desc">A packet is handled either by iptables chains scanned in order, which slow down as rules grow and give IP and port policy, or by a Cilium eBPF program using kernel map lookups with identity and HTTP aware policy and built-in visibility.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="400" y="48" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="400" y="48" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Packet</text><text x="480" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">arrives at the node</text><path d="M440,112 L440,136 Q440,144 432,144 L248,144 Q240,144 240,152 L240,176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M520,112 L520,136 Q520,144 528,144 L712,144 Q720,144 720,152 L720,176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="96" y="176" width="288" height="64" rx="6" fill="#f5f5f5"/><rect x="96" y="176" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="240" y="205" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">iptables chains</text><text x="240" y="221" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rules scanned top to bottom</text><rect x="576" y="176" width="288" height="64" rx="6" fill="#f5f5f5"/><rect x="576" y="176" width="288" height="64" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="720" y="205" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">eBPF program</text><text x="720" y="221" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runs inside the kernel, map lookups</text><text x="480" y="211" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA PATH</text><path d="M240,240 L240,272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M720,240 L720,272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="96" y="272" width="288" height="64" rx="6" fill="#f5f5f5"/><rect x="96" y="272" width="288" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="240" y="301" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Slows with scale</text><text x="240" y="317" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">list grows with each Service</text><rect x="576" y="272" width="288" height="64" rx="6" fill="#f5f5f5"/><rect x="576" y="272" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="720" y="301" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stays efficient</text><text x="720" y="317" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lookups, not linear scans</text><text x="480" y="307" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SCALING</text><path d="M240,336 L240,368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M720,336 L720,368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="96" y="368" width="288" height="64" rx="6" fill="#f5f5f5"/><rect x="96" y="368" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="240" y="397" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IP and port policy</text><text x="240" y="413" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no identity or HTTP awareness</text><rect x="576" y="368" width="288" height="64" rx="6" fill="#f5f5f5"/><rect x="576" y="368" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="720" y="397" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Identity, HTTP, API aware</text><text x="720" y="413" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">allow GET /orders, not just :8080</text><text x="480" y="403" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">POLICY DEPTH</text><path d="M240,432 L240,464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M720,432 L720,464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="96" y="464" width="288" height="64" rx="6" fill="#f5f5f5"/><rect x="96" y="464" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="240" y="493" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Limited visibility</text><text x="240" y="509" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">little built-in flow insight</text><rect x="576" y="464" width="288" height="64" rx="6" fill="#f5f5f5"/><rect x="576" y="464" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="720" y="493" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Flow visibility built in</text><text x="720" y="509" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">encryption and service map</text><text x="480" y="499" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VISIBILITY</text><text x="32" y="576" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">IPVS uses hash tables rather than a linear scan; this contrast is mainly with long iptables chains.</text><text x="32" y="592" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">eBPF programs run safely in the kernel without changing it, which is how Cilium sees layers 3 to 7.</text><line x1="32" y1="608" x2="928" y2="608" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="628" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="620" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="629" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CILIUM EBPF</text><rect x="229" y="620" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="253" y="629" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">STEP</text><rect x="307" y="620" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/><text x="331" y="629" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">DRAWBACK</text>
    </svg>
  </div>
</body>
</html>
