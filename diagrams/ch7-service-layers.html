<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service types build on each other</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layers · Services</p>
    <h1>Service types build on each other</h1>

    <svg viewBox="0 0 1000 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch7-service-layers-title ch7-service-layers-desc">
      <title id="ch7-service-layers-title">Service types build on each other</title>
      <desc id="ch7-service-layers-desc">Layer stack showing LoadBalancer built on NodePort, which is built on ClusterIP.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect x="80" y="40" width="840" height="72" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="100" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
      <text x="152" y="84" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">LoadBalancer</text>
      <text x="340" y="84" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Cloud load balancer and public external IP</text>
      <text x="900" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">type: LoadBalancer</text>
      <rect x="80" y="112" width="840" height="72" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="100" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="152" y="156" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">NodePort</text>
      <text x="340" y="156" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Same port opened on every node, 30000-32767</text>
      <text x="900" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">type: NodePort</text>
      <rect x="80" y="184" width="840" height="72" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="100" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
      <text x="152" y="228" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">ClusterIP</text>
      <text x="340" y="228" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Stable virtual IP inside the cluster only</text>
      <text x="900" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">type: ClusterIP</text>
      <text x="80" y="276" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">ExternalName sits outside this stack: it is only a DNS alias with no IP or proxying.</text>
    </svg>
  </div>
</body>
</html>
