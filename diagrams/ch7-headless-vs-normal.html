<!DOCTYPE html>

<head>

  <title>Normal vs headless Service</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }

    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>

      <desc id="ch7-headless-vs-normal-desc">Two lanes compare a normal Service, where DNS returns one virtual IP and kube-proxy picks a pod, with a headless Service, where DNS returns every ready pod IP.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

t x="120" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text><text x="120" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">asks DNS</text><rect x="340" y="164" width="200" height="120" rx="6" fill="#f5f5f5"/><rect x="340" y="164" width="200" height="120" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="440" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Headless Service</text><text x="440" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">clusterIP: None, no virtual IP</text><rect x="680" y="164" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="680" y="164" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="800" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pod-0.service-name</text><text x="800" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">A record, stable name</text><rect x="680" y="228" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="680" y="228" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="800" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pod-1.service-name</text><text x="800" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">A record, stable name</text><text x="40" y="36" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">NORMAL SERVICE</text><text x="40" y="148" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">HEADLESS SERVICE: DNS RETURNS EVERY READY POD IP</text><line x1="32" y1="324" x2="928" y2="324" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="336" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">FOCAL</text><rect x="224" y="336" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="248" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">STEP</text>
