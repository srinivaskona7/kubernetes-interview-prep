<!DOCTYPE html>

"600" font-family="'Geist', sans-serif" text-anchor="middle">Custom resource</text><text x="140" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">you apply it</text><rect x="360" y="168" width="200" height="56" rx="6" fill="#f5f5f5"/><rect x="360" y="168" width="200" height="56" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="460" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reconcile loop</text><text x="460" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">runs continuously</text><rect x="680" y="168" width="200" height="56" rx="6" fill="#f5f5f5"/><rect x="680" y="168" width="200" height="56" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="780" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reacts to failures</text><text x="780" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">primary down at 3 a.m.</text><rect x="40" y="272" width="200" height="56" rx="6" fill="#f5f5f5"/><rect x="40" y="272" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="140" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Helm chart</text><text x="140" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0">installs the Operator</text><rect x="360" y="272" width="200" height="56" rx="6" fill="#f5f5f5"/><rect x="360" y="272" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="460" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator</text><text x="460" y="312" fill="#4f5d75"  rx="2" fill="#f5f5f5"/><text x="300" y="291" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSTALLS</text><path d="M560,300 L680,300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="597" y="282" width="47" height="12" rx="2" fill="#f5f5f5"/><text x="620" y="291" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MANAGES</text><line x1="32" y1="368" x2="928" y2="368" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="380" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">FOCAL</text><rect x="288" y="380" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="312" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">STEP</text>
    </svg>
