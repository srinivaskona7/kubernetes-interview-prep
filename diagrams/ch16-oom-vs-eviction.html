<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOMKilled vs Evicted</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Troubleshooting · Memory</p>
    <h1>OOMKilled vs Evicted</h1>

    <svg viewBox="0 0 832 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch16-oom-vs-eviction-title ch16-oom-vs-eviction-desc">
<title id="ch16-oom-vs-eviction-title">OOMKilled vs Evicted</title>
<desc id="ch16-oom-vs-eviction-desc">Two rows compare the failures. OOMKilled is the kernel killing one container that passed its own memory limit, and it restarts in the same Pod. Eviction is the kubelet removing whole Pods when the node is under pressure.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="40" y="48" width="208" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="48" y="56" width="68" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="82.0" y="65" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OOMKILLED</text><text x="144.0" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container over its limit</text><text x="144.0" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">its own memory limit</text><text x="144.0" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checked by the kernel</text><rect x="312" y="48" width="208" height="88" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><rect x="320" y="56" width="48" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/><text x="344.0" y="65" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KERNEL</text><text x="416.0" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kills that container</text><text x="416.0" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">per container, not the Pod</text><text x="416.0" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SIGKILL, exit 137</text><rect x="584" y="48" width="208" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="592" y="56" width="56" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="620.0" y="65" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTCOME</text><text x="688.0" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Restarts in the same Pod</text><text x="688.0" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Reason: OOMKilled</text><text x="688.0" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RESTARTS count rises</text><path d="M248 92 L312 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="280" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">enforced by</text><path d="M520 92 L584 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="552" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">result</text><rect x="40" y="176" width="208" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="48" y="184" width="56" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="76.0" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVICTED</text><text x="144.0" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node under pressure</text><text x="144.0" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">memory or disk is low</text><text x="144.0" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">seen by the kubelet</text><rect x="312" y="176" width="208" height="88" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><rect x="320" y="184" width="56" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/><text x="348.0" y="193" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KUBELET</text><text x="416.0" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Evicts whole Pods</text><text x="416.0" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">picks by requests, priority</text><text x="416.0" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BestEffort goes first</text><rect x="584" y="176" width="208" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="592" y="184" width="56" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="620.0" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTCOME</text><text x="688.0" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod removed, replaced</text><text x="688.0" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">status: Evicted</text><text x="688.0" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">controller reschedules it</text><path d="M248 220 L312 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="280" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">enforced by</text><path d="M520 220 L584 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="552" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">result</text><line x1="32" y1="280" x2="800" y2="280" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="120" y1="292" x2="148" y2="292" stroke="#4f5d75" stroke-width="1.2"/><text x="156" y="295" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flow</text><rect x="199" y="288" width="12" height="8" rx="2" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><text x="219" y="295" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">who acts</text>
    </svg>
  </div>
</body>
</html>
