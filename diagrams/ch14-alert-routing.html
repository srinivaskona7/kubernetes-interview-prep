<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert routing</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Monitoring · Observability</p>
    <h1>Alert routing</h1>
    <svg viewBox="0 0 936 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch14-alert-routing-title ch14-alert-routing-desc">
      <title id="ch14-alert-routing-title">Alert routing</title>
      <desc id="ch14-alert-routing-desc">A Prometheus alert rule fires to Alertmanager, which groups, deduplicates and silences, then routes critical alerts to a page with escalation to a second person and warnings to a chat channel or ticket queue.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M208,208 L308,208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M492,208 L580,208 Q588,208 588,200 L588,76 Q588,68 596,68 L684,68" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M492,208 L580,208 Q588,208 588,216 L588,300 Q588,308 596,308 L684,308" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M796,96 L796,136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M400,312 L400,256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="258" y="202" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIRES</text>
<text x="636" y="62" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CRITICAL</text>
<text x="636" y="302" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WARNING</text>
<text x="804" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">NO ACK</text>
<text x="408" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">MUTES</text>
<text x="40" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">EVERY PAGE URGENT, ACTIONABLE AND OWNED, OR DELETE THE ALERT</text>
<rect x="40" y="172" width="168" height="72" rx="6" fill="#f5f5f5"/><rect x="40" y="172" width="168" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="124.0" y="200.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Alert rule</text><text x="124.0" y="216.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">for: duration, severity,</text><text x="124.0" y="228.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">owner, runbook link</text>
<rect x="308" y="160" width="184" height="96" rx="6" fill="#f5f5f5"/><rect x="308" y="160" width="184" height="96" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="400.0" y="200.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Alertmanager</text><text x="400.0" y="216.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">group, deduplicate,</text><text x="400.0" y="228.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">route by severity</text>
<rect x="684" y="40" width="224" height="56" rx="6" fill="#f5f5f5"/><rect x="684" y="40" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="796.0" y="66.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Page on-call</text><text x="796.0" y="82.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">critical: act now</text>
<rect x="684" y="136" width="224" height="56" rx="6" fill="#f5f5f5"/><rect x="684" y="136" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="796.0" y="162.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Escalate</text><text x="796.0" y="178.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">second person or group</text>
<rect x="684" y="280" width="224" height="56" rx="6" fill="#f5f5f5"/><rect x="684" y="280" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="796.0" y="306.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chat or ticket</text><text x="796.0" y="322.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">warning: review in hours</text>
<rect x="308" y="312" width="184" height="56" rx="6" fill="#f5f5f5"/><rect x="308" y="312" width="184" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="400.0" y="338.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Silences</text><text x="400.0" y="354.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">planned maintenance</text>
<line x1="30" y1="432" x2="906" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="30" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="440" width="12" height="12" rx="2" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="140" y="449" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL</text><rect x="205.0" y="440" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="225.0" y="449" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">COMPONENT</text><rect x="310.0" y="440" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="330.0" y="449" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CONFIG</text>
    </svg>
  </div>
</body>
</html>
