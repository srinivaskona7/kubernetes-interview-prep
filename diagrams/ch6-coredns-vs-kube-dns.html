    <p class="eyebrow">Networking · DNS</p>
    <h1>CoreDNS replaced kube-dns as the cluster DNS server</h1>
    <svg viewBox="0 0 960 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch6-coredns-vs-kube-dns-title ch6-coredns-vs-kube-dns-desc">
      <title id="ch6-coredns-vs-kube-dns-title">CoreDNS replaced kube-dns as the cluster DNS server</title>
      <desc id="ch6-coredns-vs-kube-dns-desc">A client Pod queries the Service named kube-dns. Behind it, legacy kube-dns used several containers, while current CoreDNS is one plugin-based server configured by the Corefile ConfigMap. Both watch the API server for Services and Endpoints.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

)" stroke-width="1" stroke-dasharray="4,3"/><text x="287" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">LEGACY</text><rect x="352" y="508" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="376" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">COMPONENT</text><line x1="458" y1="514" x2="486" y2="514" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/><text x="494" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">WATCH OR OLD PATH</text>
