<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which autoscaler fits</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Scaling · Decision</p>
    <h1>Which autoscaler fits</h1>

    <svg viewBox="0 0 1160 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch4-which-autoscaler-title ch4-which-autoscaler-desc">
      <title id="ch4-which-autoscaler-title">Which autoscaler fits</title>
      <desc id="ch4-which-autoscaler-desc">Decision flowchart choosing between VPA, HPA and KEDA based on whether the app can run more copies and which signal drives scaling.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M420 68 V120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M540 168 H640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="576" y="148" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="590" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<path d="M420 216 V296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="428" y="250" width="24" height="12" rx="2" fill="#f5f5f5"/>
<text x="440" y="259" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<path d="M760 216 V296" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="768" y="250" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="782" y="259" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<path d="M880 168 H964" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="908" y="148" width="24" height="12" rx="2" fill="#f5f5f5"/>
<text x="920" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<rect x="300" y="28" width="240" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text font-weight="600" x="420" y="52" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Load or demand changes</text>
<polygon points="420,120 540,168 420,216 300,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text font-weight="600" x="420" y="166" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Can the app run</text>
<text font-weight="600" x="420" y="182" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">more copies?</text>
<polygon points="760,120 880,168 760,216 640,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text font-weight="600" x="760" y="166" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Is CPU or memory</text>
<text font-weight="600" x="760" y="182" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">signal enough?</text>
<rect x="300" y="296" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="300" y="296" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="420" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VPA</text>
<text x="420" y="342" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">resize requests and limits</text>
<rect x="640" y="296" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="640" y="296" width="240" height="64" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="760" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HPA</text>
<text x="760" y="342" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">add or remove replicas</text>
<rect x="964" y="136" width="160" height="64" rx="6" fill="#f5f5f5"/>
<rect x="964" y="136" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="1044" y="166" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">KEDA</text>
<text x="1044" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">queue / event driven</text>
<text x="580" y="404" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', serif" text-anchor="middle" font-style="italic">Avoid pointing HPA and VPA at the same workload.</text>

    </svg>
  </div>
</body>
</html>
