<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How RBAC connects who to what</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · RBAC</p>
    <h1>How RBAC connects who to what</h1>
    <svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch9-rbac-chain-title ch9-rbac-chain-desc">
      <title id="ch9-rbac-chain-title">How RBAC connects who to what</title>
      <desc id="ch9-rbac-chain-desc">Subjects such as users, groups and service accounts are bound by a RoleBinding to a Role that allows specific verbs on pods.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <path d="M200,100 H264 Q272,100 272,108 V148 Q272,156 280,156 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M200,180 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M200,260 H256 Q264,260 264,252 V212 Q264,204 272,204 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M480,180 H600" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M744,180 H840" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="512" y="160" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROLEREF</text>
      <rect x="768" y="160" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="792" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOWS</text>
      <rect x="40" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="72" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>
      <text x="120" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">jane.doe@example.com</text>
      <rect x="40" y="152" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="152" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Group</text>
      <text x="120" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">a set of users</text>
      <rect x="40" y="232" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="232" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ServiceAccount</text>
      <text x="120" y="276" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">identity for a Pod</text>
      <rect x="320" y="136" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="136" width="160" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="400" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RoleBinding</text>
      <text x="400" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">who gets the role</text>
      <rect x="600" y="136" width="144" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="136" width="144" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="672" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Role</text>
      <text x="672" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">verbs on resources</text>
      <rect x="840" y="136" width="120" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="136" width="120" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="900" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pods</text>
      <text x="900" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">get, list, watch</text>
      <text x="40" y="344" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">RoleBinding + Role apply inside one namespace. ClusterRoleBinding + ClusterRole apply cluster-wide.</text>
    </svg>
  </div>
</body>
</html>
