<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>When you do not know</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Answering</p>
    <h1>When you do not know</h1>

    <svg viewBox="0 0 880 264" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch18-dont-know-title ch18-dont-know-desc">
      <title id="ch18-dont-know-title">When you do not know</title>
      <desc id="ch18-dont-know-desc">Four steps when you do not know an answer: admit the gap, share neighbouring facts, reason aloud to a labelled guess, then say how you would verify. Bluffing is the thing to avoid.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="40" y="56" width="188" height="64" rx="8" fill="#f5f5f5"/><rect x="40" y="56" width="188" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="134" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 1</text><text x="134" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Admit the gap</text><text x="134" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one plain sentence</text><path d="M228,88 H244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="244" y="56" width="188" height="64" rx="8" fill="#f5f5f5"/><rect x="244" y="56" width="188" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="338" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 2</text><text x="338" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Share neighbours</text><text x="338" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">related facts you know</text><path d="M432,88 H448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="448" y="56" width="188" height="64" rx="8" fill="#f5f5f5"/><rect x="448" y="56" width="188" height="64" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="542" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 3</text><text x="542" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reason aloud</text><text x="542" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">a labelled best guess</text><path d="M636,88 H652" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="652" y="56" width="188" height="64" rx="8" fill="#f5f5f5"/><rect x="652" y="56" width="188" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="746" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 4</text><text x="746" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Say how to verify</text><text x="746" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">docs, test cluster, owner</text><text x="134" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">"I have not used that"</text><text x="338" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">"sounds like X, so Y"</text><text x="542" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">"my guess is..."</text><text x="746" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">"I would confirm by..."</text><rect x="244" y="184" width="392" height="40" rx="20" fill="#f5f5f5"/><rect x="244" y="184" width="392" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="440" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Avoid: bluffing</text><text x="440" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">follow-up questions expose a bluff; honest reasoning scores better</text>
    </svg>
  </div>
</body>
</html>
