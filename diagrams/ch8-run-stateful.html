<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Should a stateful app run in Kubernetes?</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Decision · Trade-offs</p>
    <h1>Should a stateful app run in Kubernetes?</h1>

    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch8-run-stateful-title ch8-run-stateful-desc">
<title id="ch8-run-stateful-title">Should a stateful app run in Kubernetes?</title>
<desc id="ch8-run-stateful-desc">Critical relational databases are safer on a managed service or dedicated hosts; caches, queues and replicated NoSQL fit StatefulSets with PVCs and an operator, with restores tested.</desc>
<defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<polyline points="220,164 272,164 272,80 320,80" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="220,164 272,164 272,248 320,248" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="520,80 620,80" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="520,248 620,248" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="790,272 790,316" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="140" width="180" height="48" rx="6" fill="#f5f5f5"/>
<rect x="40" y="140" width="180" height="48" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="130" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stateful app</text>
<text x="130" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">where should it run?</text>
<rect x="320" y="56" width="200" height="48" rx="6" fill="#f5f5f5"/>
<rect x="320" y="56" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="420" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Critical relational DB</text>
<text x="420" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the disk is the product</text>
<rect x="320" y="224" width="200" height="48" rx="6" fill="#f5f5f5"/>
<rect x="320" y="224" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="420" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cache, queue, NoSQL</text>
<text x="420" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">replicated by design</text>
<rect x="620" y="56" width="340" height="48" rx="6" fill="#f5f5f5"/>
<rect x="620" y="56" width="340" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="790" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Managed service or dedicated hosts</text>
<text x="790" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">backups, failover, PITR handled for you</text>
<rect x="620" y="224" width="340" height="48" rx="6" fill="#f5f5f5"/>
<rect x="620" y="224" width="340" height="48" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/>
<text x="790" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StatefulSet, PVCs, operator</text>
<text x="790" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">operator automates backup and upgrade</text>
<rect x="620" y="316" width="340" height="48" rx="6" fill="#f5f5f5"/>
<rect x="620" y="316" width="340" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="790" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Test restores, plan drains</text>
<text x="790" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">zone loss, disk expansion</text>
<text x="40" y="376" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', serif">Not a yes or no: the trade-off is who owns backups, failover and upgrades.</text>
    </svg>
  </div>
</body>
</html>
