<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontal versus vertical scaling</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Scaling · Comparison</p>
    <h1>Horizontal versus vertical scaling</h1>

    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch4-scale-out-vs-up-title ch4-scale-out-vs-up-desc">
      <title id="ch4-scale-out-vs-up-title">Horizontal versus vertical scaling</title>
      <desc id="ch4-scale-out-vs-up-desc">Comparison of scaling out by adding Pod replicas with scaling up by giving one Pod more CPU and memory.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="32" y="40" width="456" height="320" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text letter-spacing="0.14em" x="48" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">SCALE OUT · MORE REPLICAS</text>
<rect x="512" y="40" width="456" height="320" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text letter-spacing="0.14em" x="528" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">SCALE UP · BIGGER POD</text>
<path d="M172 180 H228 Q236 180 236 172 V140 Q236 132 244 132 H300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M172 200 H300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M172 220 H228 Q236 220 236 228 V260 Q236 268 244 268 H300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M652 200 H740" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="60" y="160" width="112" height="80" rx="6" fill="#f5f5f5"/>
<rect x="60" y="160" width="112" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="116" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Traffic</text>
<rect x="300" y="108" width="140" height="48" rx="6" fill="#f5f5f5"/>
<rect x="300" y="108" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="370" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod</text>
<text x="370" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 vCPU / 2 GiB</text>
<rect x="300" y="176" width="140" height="48" rx="6" fill="#f5f5f5"/>
<rect x="300" y="176" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="370" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod</text>
<text x="370" y="214" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 vCPU / 2 GiB</text>
<rect x="300" y="244" width="140" height="48" rx="6" fill="#f5f5f5"/>
<rect x="300" y="244" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="370" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pod</text>
<text x="370" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 vCPU / 2 GiB</text>
<rect x="540" y="160" width="112" height="80" rx="6" fill="#f5f5f5"/>
<rect x="540" y="160" width="112" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="596" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Traffic</text>
<rect x="740" y="128" width="180" height="144" rx="6" fill="#f5f5f5"/>
<rect x="740" y="128" width="180" height="144" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="830" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One larger Pod</text>
<text x="830" y="214" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">4 vCPU / 8 GiB</text>
<text x="60" y="320" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="start">Work is shared. Add or remove copies.</text>
<text x="540" y="320" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="start">One pod is resized. Ceiling is the node size.</text>
<text x="60" y="344" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">kubectl scale, HPA</text>
<text x="540" y="344" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">edit requests/limits, VPA</text>

    </svg>
  </div>
</body>
</html>
