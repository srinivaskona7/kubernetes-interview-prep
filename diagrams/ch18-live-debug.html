<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live debugging method</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Live debugging</p>
    <h1>Live debugging method</h1>

    <svg viewBox="0 0 880 228" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch18-live-debug-title ch18-live-debug-desc">
      <title id="ch18-live-debug-title">Live debugging method</title>
      <desc id="ch18-live-debug-desc">Five-step live debugging method: state the symptom, check events and status before logs, form a hypothesis, test it one change at a time, then fix and verify. A loop returns from test to hypothesis when a guess is ruled out.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="24" y="40" width="144" height="64" rx="8" fill="#f5f5f5"/><rect x="24" y="40" width="144" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="96" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 1</text><text x="96" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Symptom</text><text x="96" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">state what you see</text><path d="M168,72 H196" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="196" y="40" width="144" height="64" rx="8" fill="#f5f5f5"/><rect x="196" y="40" width="144" height="64" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="268" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 2</text><text x="268" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Events, status</text><text x="268" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">before logs</text><path d="M340,72 H368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="368" y="40" width="144" height="64" rx="8" fill="#f5f5f5"/><rect x="368" y="40" width="144" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="440" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 3</text><text x="440" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hypothesis</text><text x="440" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">say it out loud</text><path d="M512,72 H540" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="540" y="40" width="144" height="64" rx="8" fill="#f5f5f5"/><rect x="540" y="40" width="144" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="612" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 4</text><text x="612" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Test</text><text x="612" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one change at a time</text><path d="M684,72 H712" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="712" y="40" width="144" height="64" rx="8" fill="#f5f5f5"/><rect x="712" y="40" width="144" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="784" y="60" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STEP 5</text><text x="784" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fix, verify</text><text x="784" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">then name a prevention</text><path d="M612,104 V132 Q612,140 604,140 H448 Q440,140 440,132 V104" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="455.0" y="134" width="142" height="14" fill="#f5f5f5"/><text x="526" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ruled out? next hypothesis</text><text x="440" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">start wide and cheap (status, events), then narrow: logs, node conditions, limits, network</text><text x="440" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stuck? say what you have ruled out and what you would check next</text>
    </svg>
  </div>
</body>
</html>
