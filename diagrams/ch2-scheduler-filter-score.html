<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduler filter and score</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart</p>
    <h1>How the scheduler picks a node</h1>
    <svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch2-scheduler-filter-score-title ch2-scheduler-filter-score-desc">
      <title id="ch2-scheduler-filter-score-title">Scheduler filter and score</title>
      <desc id="ch2-scheduler-filter-score-desc">Flow from a pending Pod through filtering and scoring to binding on the best node.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M200,120 L280,120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M440,120 L520,120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M680,120 L760,120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M360,152 L360,192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M600,192 L600,152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="210" y="114" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="240" y="123" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW POD</text>
<rect x="332" y="166" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="360" y="175" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REJECTS</text>
<rect x="580" y="166" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="600" y="175" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FEEDS</text>
<rect x="464" y="114" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="123" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIT</text>
<rect x="700" y="114" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="720" y="123" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BEST</text>
<rect x="40" y="88" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="40" y="88" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="120" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pending Pod</text>
<text x="120" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">requests, selectors</text>
<rect x="280" y="88" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="280" y="88" width="160" height="64" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="360" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Filter</text>
<text x="360" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">drop unfit nodes</text>
<rect x="520" y="88" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="520" y="88" width="160" height="64" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
<text x="600" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score</text>
<text x="600" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">rank what is left</text>
<rect x="760" y="88" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="760" y="88" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="840" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bind</text>
<text x="840" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Pod assigned to node</text>
<rect x="280" y="192" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="280" y="192" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="360" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cannot fit</text>
<text x="360" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CPU, taints, labels</text>
<rect x="520" y="192" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="520" y="192" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="600" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Preferences</text>
<text x="600" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">spread, affinity, free</text>
<line x1="30" y1="324" x2="930" y2="324" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="30" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="120" y="332" width="12" height="12" rx="2" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><text x="140" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL PHASE</text>
<rect x="310" y="332" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="330" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">STEP OR INPUT</text>
    </svg>
  </div>
</body>
</html>
