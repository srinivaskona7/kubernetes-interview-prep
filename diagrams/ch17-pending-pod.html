<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debugging a Pending Pod</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Troubleshooting · Scheduling</p>
    <h1>Debugging a Pending Pod</h1>

    <svg viewBox="0 0 1000 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch17-pending-pod-title ch17-pending-pod-desc">
      <title id="ch17-pending-pod-title">Debugging a Pending Pod</title>
      <desc id="ch17-pending-pod-desc">Pod is Pending; describe pod events name the first failing scheduler check, then four checks in order: requests, taints, placement rules, volumes.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      
      <rect x="40" y="56" width="200" height="84" rx="6" fill="#f5f5f5"/><rect x="40" y="56" width="200" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="52" y="66" width="43" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="73" y="75" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATUS</text><text x="52" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Pod is Pending</text><text x="52" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">API accepted it,</text><text x="52" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">no node chosen yet</text>
<rect x="288" y="56" width="336" height="84" rx="6" fill="#f5f5f5"/><rect x="288" y="56" width="336" height="84" rx="6" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><rect x="300" y="66" width="62" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/><text x="331" y="75" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FIRST STEP</text><text x="300" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">kubectl describe pod</text><text x="300" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Events: FailedScheduling names</text><text x="300" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">the first check that failed</text>
<rect x="40" y="200" width="200" height="84" rx="6" fill="#f5f5f5"/><rect x="40" y="200" width="200" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="52" y="210" width="105" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="105" y="219" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK 1 · RESOURCES</text><text x="52" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Requests vs free room</text><text x="52" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">requests, not limits</text><text x="52" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">fix: lower it, add a node</text>
<rect x="280" y="200" width="200" height="84" rx="6" fill="#f5f5f5"/><rect x="280" y="200" width="200" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="292" y="210" width="91" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="337" y="219" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK 2 · TAINTS</text><text x="292" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Taints vs tolerations</text><text x="292" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">an untolerated taint</text><text x="292" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">fix: add a toleration</text>
<rect x="520" y="200" width="200" height="84" rx="6" fill="#f5f5f5"/><rect x="520" y="200" width="200" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="532" y="210" width="105" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="585" y="219" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK 3 · PLACEMENT</text><text x="532" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Selector and affinity</text><text x="532" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">no node matches the rule</text><text x="532" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">fix: relax or label a node</text>
<rect x="760" y="200" width="200" height="84" rx="6" fill="#f5f5f5"/><rect x="760" y="200" width="200" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="772" y="210" width="96" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="820" y="219" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK 4 · VOLUMES</text><text x="772" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">PVC binding</text><text x="772" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">the claim stays unbound</text><text x="772" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">fix: StorageClass or PV</text>
      <path d="M240,98 L288,98" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="264" y="90" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>
<text x="664" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Not an app crash:</text>
<text x="664" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">the app never started.</text>
<path d="M456,140 L456,164 Q456,172 448,172 L148,172 Q140,172 140,180 L140,200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="260" y="164" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK IN ORDER</text>
<path d="M240,242 L280,242" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="260" y="234" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">THEN</text>
<path d="M480,242 L520,242" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="500" y="234" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">THEN</text>
<path d="M720,242 L760,242" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="740" y="234" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">THEN</text>
<text x="40" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">The cluster autoscaler may need about a minute to add a node.</text>
      <line x1="32" y1="348" x2="968" y2="348" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text><line x1="120" y1="360" x2="148" y2="360" stroke="#4f5d75" stroke-width="1.2"/><text x="156" y="363" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flow</text><rect x="212" y="356" width="12" height="8" rx="2" fill="#fdeee7" stroke="#eb6c36" stroke-width="1"/><text x="232" y="363" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">read this first</text>
    </svg>
  </div>
</body>
</html>
