    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }

      <title id="ch13-ha-vs-reliability-vs-resiliency-title">Availability, reliability and resiliency</title>
      <desc id="ch13-ha-vs-reliability-vs-resiliency-desc">Three ideas side by side. High availability asks whether users can still reach the service, reliability asks whether it works correctly, and resiliency asks how quickly it recovers. Each is achieved with a different set of Kubernetes tools.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="48" y="48" width="272" height="72" rx="6" fill="#f5f5f5"/><rect x="48" y="48" width="272" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="184.0" y="76.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">High availability</text><text x="184.0" y="92.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Can users still reach it?</text><path d="M184,120 V184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="146.0" y="146" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="184" y="155" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACHIEVED BY</text><rect x="48" y="184" width="272" height="88" rx="6" fill="#f5f5f5"/><rect x="48" y="184" width="272" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="184.0" y="208.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Replicas and spread</text><text x="184.0" y="224.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3 replicas on different nodes,</text><text x="184.0" y="236.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">multiple control plane nodes,</text><text x="184.0" y="248.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">zones, PDBs</text><text x="184" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ALONE: UP, BUT MAYBE SLOW OR BUGGY</text><rect x="352" y="48" width="272" height="72" rx="6" fill="#f5f5f5"/><rect x="352" y="48" width="272" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="488.0" y="76.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reliability</text><text x="488.0" y="92.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Does it work correctly?</text><path d="M488,120 V184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="450.0" y="146" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="488" y="155" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACHIEVED BY</text><rect x="352" y="184" width="272" height="88" rx="6" fill="#f5f5f5"/><rect x="352" y="184" width="272" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="488.0" y="214.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Steady behaviour</text><text x="488.0" y="230.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">requests and limits, probes,</text><text x="488.0" y="242.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">autoscaling, load testing</text><text x="488" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ALONE: CORRECT, BUT MAY GO DOWN OFTEN</text><rect x="656" y="48" width="272" height="72" rx="6" fill="#f5f5f5"/><rect x="656" y="48" width="272" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="792.0" y="76.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Resiliency</text><text x="792.0" y="92.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">How fast does it recover?</text><path d="M792,120 V184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="754.0" y="146" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="792" y="155" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACHIEVED BY</text><rect x="656" y="184" width="272" height="88" rx="6" fill="#f5f5f5"/><rect x="656" y="184" width="272" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="792.0" y="208.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Recovery</text><text x="792.0" y="224.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">self-healing restarts,</text><text x="792.0" y="236.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">rolling updates, replicated</text><text x="792.0" y="248.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">data, backups</text><text x="792" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ALONE: BACK IN SECONDS, YET MAY FAIL OFTEN</text><text x="480" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Each can hold while another fails, so a good answer gives a concrete example of one missing.</text>
