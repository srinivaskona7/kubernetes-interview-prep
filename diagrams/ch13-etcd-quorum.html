<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three-member etcd with one member down</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State</p>
    <h1>Three-member etcd with one member down</h1>
    <svg viewBox="0 0 960 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch13-etcd-quorum-title ch13-etcd-quorum-desc">
      <title id="ch13-etcd-quorum-title">Three-member etcd with one member down</title>
      <desc id="ch13-etcd-quorum-desc">Diagram showing a three-member etcd cluster where the leader and one follower acknowledge a write, which commits with two of three votes even though the third member is down.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M448,128 V160 Q448,168 440,168 H328 Q320,168 320,176 V224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="348" y="150" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="384" y="159" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 REPLICATE</text><path d="M512,128 V160 Q512,168 520,168 H632 Q640,168 640,176 V224" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/><rect x="544" y="150" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="576" y="159" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 NO REPLY</text><path d="M480,128 V352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="476" y="236" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="508" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEADER OWN</text><path d="M320,288 V376 Q320,384 328,384 H400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="328" y="312" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="348" y="321" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 ACK</text><rect x="400" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="400" y="64" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Leader</text><text x="480" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">member 1, accepts writes</text><rect x="240" y="224" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="240" y="224" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="320" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Follower</text><text x="320" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">member 2, in sync</text><rect x="560" y="224" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="560" y="224" width="160" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/><text x="640" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Follower (down)</text><text x="640" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">member 3, unreachable</text><rect x="400" y="352" width="160" height="64" rx="6" fill="#f5f5f5"/><rect x="400" y="352" width="160" height="64" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="480" y="382" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write committed</text><text x="480" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2 of 3 = quorum</text><line x1="32" y1="440" x2="928" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="112" y="452" width="16" height="12" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/><text x="136" y="461" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">OUTCOME</text><rect x="224" y="452" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="248" y="461" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">HEALTHY MEMBER</text><rect x="384" y="452" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/><text x="408" y="461" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">UNREACHABLE MEMBER</text>
    </svg>
  </div>
</body>
</html>
